[profile.default]
src = "src"
out = "out"
libs = []
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
extra_output = ["storageLayout"]

# Pinned so the fuzz and invariant campaign in CI is reproducible
# (docs/security/escrow-ai-review-2026-10-12.md, section 2).
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 500
