[package]
name = "slop-escrow"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib", "lib"]
name = "slop_escrow"
[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []
# Lowers the on-chain binding delay floor to one second for the local end-to-end suite.
short-delay-for-tests = []
[dependencies]
# allow-missing-optionals: a trailing optional account (commit_monthly's month_pledge) may be
# left off entirely, so callers that predate it keep working.
anchor-lang = { version = "=0.32.1", features = ["init-if-needed", "allow-missing-optionals"] }
anchor-spl = { version = "=0.32.1", features = ["token", "associated_token"] }
solana-sha256-hasher = "=2.3.0"
