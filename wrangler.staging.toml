name = "slop-staging"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-30"

[vars]
PUBLIC_SITE_URL = "https://staging.slop.cash"
SLOP_ENVIRONMENT = "staging"
PAYMENTS_ALLOWED_ORIGIN = "https://staging.slop.cash"
# GitHub numeric actor IDs allowed to review project applications: lalalune
# and drew-dot-com. Admin email recipients live in workers/notify.
ADMIN_GITHUB_IDS = "18633264,202660855"
# Initial isolated moderation pilot: PRD close-out direction, 22 October 2026.
PROJECT_MODERATOR_GITHUB_IDS = "18633264,202660855"
# Monthly payment period (owner decision D1, 24 October 2026): calendar UTC
# month from 2026-11; the cutoff is 72 hours after the month ends.
MONTHLY_PAYMENT_SCHEDULE = '{"firstPeriod":"2026-11","cutoffSecondsAfterPeriodEnd":259200}'
# Registry test networks whose vaults accept wallet bindings and owner
# actions on staging (#904 item 6). Each has its staging payment stack,
# slop-payments-NETWORK-staging-*, generated by workers/payment-executor/
# configure.mjs --environment staging. Never a mainnet.
PAYMENT_NETWORKS = '["base-sepolia","ethereum-sepolia","robinhood-testnet","solana-devnet"]'
# Automatic private-report intake (PRD section 8; owner activation of 26
# October 2026). Routes stay closed unless every intake App secret is set.
SLOP_PRIVATE_INTAKE_MODE = "on"

[[d1_databases]]
binding = "SLOP_DB"
database_name = "slop-staging"
database_id = "6fcddcc1-f3d7-4175-bdde-09afddd53a8a"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PRIVATE_TRACES"
bucket_name = "slop-staging-traces"

# Scanner evidence is separate from permanent contributor traces.
# Access requires the fixed-in-source evidence policy (EVIDENCE_POLICY in evidence.ts) and scanner public keys.
[[r2_buckets]]
binding = "VETTING_EVIDENCE"
bucket_name = "slop-staging-vetting-evidence"

# Installation lookup and a separate authenticated historical publisher.
# Both remain isolated from production databases, bot queues and model routes.
[[services]]
binding = "SLOPBOT"
service = "slop-repository-access-staging"

[[services]]
binding = "SLOPBOT_VALUE_IMPORT"
service = "slop-repository-access-staging"
entrypoint = "HistoricalValuePublisher"

[[services]]
binding = "VETTING_SANDBOX"
service = "slop-vetting-sandbox-staging"

[[services]]
binding = "SLOP_IDENTITY"
service = "slop-identity-staging"

# Only the protected development release gets test backend bindings.
[env.preview]
d1_databases = []
r2_buckets = []
services = []

[env.preview.vars]
PUBLIC_SITE_URL = "https://staging.slop.cash"
SLOP_ENVIRONMENT = "staging"
