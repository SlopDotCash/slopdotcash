[profile.default]
src = "src"
out = "out"
cache_path = ".cache/forge"
libs = []
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

# Pinned so the fuzz and invariant campaign in CI is reproducible
# (SlopDotCash/slopdotcash, docs/security/escrow-ai-review-2026-10-12.md, section 2).
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 500

# `forge lint` stays a separate command: on every build it took minutes.
[lint]
lint_on_build = false

# The SMTChecker run of `pnpm test` (../README.md, "Money invariants"). BMC explores every path of the loop-free
# libraries and of the calendar lemmas for every input; z3 must be on PATH.
[profile.smt]
out = ".cache/smt/out"
cache_path = ".cache/smt/cache"

[profile.smt.model_checker]
contracts = { "src/EscrowMath.sol" = ["EscrowMath"], "src/MonthlyCalendar.sol" = ["MonthlyCalendar"], "src/ReferralClaims.sol" = ["ReferralClaims"], "test/smt/CalendarLemmas.sol" = ["CalendarLemmas"] }
engine = "bmc"
# No per-query limit. solc encodes a narrowing conversion such as uint32(x) with int2bv, and under its default
# resource limit z3 cannot prove even uint32(x) == x for x < 100; the calendar lemmas need one. Each BMC query is
# decidable, so a run ends when z3 answers.
timeout = 0
targets = ["assert", "underflow", "overflow", "divByZero"]
show_proved_safe = true
show_unproved = true
show_unsupported = true

# CHC proves the lemmas of the never-deployed test/smt/ contracts about the libraries ProjectEscrow and
# ReferralDistributor inline.
[profile.smt_chc]
out = ".cache/smt-chc/out"
cache_path = ".cache/smt-chc/cache"

[profile.smt_chc.model_checker]
contracts = { "test/smt/EscrowLemmas.sol" = ["EscrowLemmas"], "test/smt/ReferralLemmas.sol" = ["ReferralLemmas"] }
engine = "chc"
targets = ["assert", "underflow", "overflow", "divByZero"]
show_proved_safe = true
show_unproved = true
show_unsupported = true
