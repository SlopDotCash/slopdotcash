name: setup
description: Node 26, pnpm from packageManager and its cache; with verification, Dafny from its pinned release, Quint's evaluator, Chromium, Foundry with solc and z3, Rust and Python 3, the pinned merge Git built where the Git journeys look for it, and the spec cache; with solana, the pinned Agave CLI and program builder, their platform tools and the reviewed validator image; Turborepo's local cache for pull requests and local-only branch pushes; for publication, a locked install without lifecycle scripts or any cache.
inputs:
  job:
    description: Names the caches this job saves. The contracts job installs only the native contract tools and pinned package runner.
    default: verify
  verification:
    description: Set up the tools pnpm verify needs beyond Node and pnpm.
    default: "true"
  cache-verification:
    description: Restore prior verification results. Nightly checks run fresh.
    default: "true"
  publication:
    description: A job that builds a release bundle, publishes or holds deployment secrets restores no cache and installs without lifecycle scripts; it sets verification to "false".
    default: "false"
  solana:
    description: Put the pinned Agave solana CLI and program builder on PATH with the platform tools its tests build with, cached by their versions, and pull the reviewed Solana test validator image by its digest.
    default: "false"
outputs:
  spec-cache-path:
    description: What the spec cache holds, for the step that saves it at the end of a job.
    value: ${{ steps.spec-cache.outputs.path }}
  spec-cache-key:
    description: The key to save the spec cache under, unique to this run attempt; present when verification results are restored.
    value: ${{ steps.spec-cache.outputs.key }}
  spec-evaluator-restored:
    description: Whether the fixture job reused its pinned evaluator from a spec cache for the same lockfile.
    value: ${{ steps.install-quint-evaluator.outputs.spec-evaluator-restored }}
  turbo-cache-key:
    description: The key for Turborepo's local cache on pull requests and local-only branch pushes, unique to this run attempt.
    value: ${{ steps.turbo-cache.outputs.key }}
runs:
  using: composite
  steps:
    - name: Refuse verification tools in a publication job
      if: inputs.publication == 'true' && inputs.verification == 'true'
      shell: bash
      run: |
        echo "::error::A publication job sets verification to false."
        exit 1
    - id: setup-pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
    - name: Install Dafny
      if: inputs.verification == 'true' && inputs.job != 'contracts' && !startsWith(inputs.job, 'simulate-')
      shell: bash
      run: |
        version=4.11.0
        curl --fail --location --retry 3 -o "$RUNNER_TEMP/dafny.zip" "https://github.com/dafny-lang/dafny/releases/download/v$version/dafny-$version-x64-ubuntu-22.04.zip"
        echo "a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179  $RUNNER_TEMP/dafny.zip" | sha256sum --check --strict
        unzip -q "$RUNNER_TEMP/dafny.zip" -d "$RUNNER_TEMP"
        "$RUNNER_TEMP/dafny/dafny" --version
        echo "$RUNNER_TEMP/dafny" >> "$GITHUB_PATH"
    - name: Install Foundry
      if: inputs.verification == 'true'
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
      with:
        version: v1.7.1
        cache: false
    - name: Install solc and z3
      if: inputs.verification == 'true'
      shell: bash
      run: |
        set -euo pipefail
        version=0.8.30
        target="$HOME/.svm/$version/solc-$version"
        mkdir -p "$(dirname "$target")"
        curl --fail --location --retry 3 -o "$target" "https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v$version+commit.73712a01"
        echo "f3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7  $target" | sha256sum --check --strict
        chmod 0755 "$target"
        "$target" --version
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends z3 libcurl4-openssl-dev
        z3 --version
        forge --version
    - name: Check Rust and Python 3
      if: inputs.verification == 'true'
      shell: bash
      run: |
        cargo --version
        rustc --version
        python3 --version
    - name: Read the pinned merge Git release
      id: merge-git
      if: inputs.verification == 'true' && inputs.job != 'contracts' && !startsWith(inputs.job, 'simulate-')
      shell: bash
      run: |
        set -euo pipefail
        installer=packages/platform/src/git/install.vibe
        source="$(sed -n 's/^export const PINNED_GIT_SOURCE = "\(https:\/\/www\.kernel\.org\/pub\/software\/scm\/git\/git-[0-9.]\+\.tar\.xz\)"$/\1/p' "$installer")"
        sha="$(sed -n 's/^export const PINNED_GIT_SHA256 = "\([0-9a-f]\{64\}\)"$/\1/p' "$installer")"
        version="$(sed -n 's/^export const MERGE_GIT_VERSION = "git version \([0-9]\+\.[0-9]\+\.[0-9]\+\)"$/\1/p' packages/platform/src/git/model.vibe)"
        [[ -n $source && -n $sha && -n $version && $source == */git-$version.tar.xz ]] || { echo "::error::$installer and the merge profile name no single pinned Git release."; exit 1; }
        printf 'source=%s\nsha=%s\nversion=%s\ntarget=%s\nkey=merge-git-%s-%s-%s\n' "$source" "$sha" "$version" "$PWD/packages/platform/.cache/merge-git-$version" "$RUNNER_OS" "$RUNNER_ARCH" "$sha" >> "$GITHUB_OUTPUT"
    - id: restore-merge-git
      if: steps.merge-git.outputs.key != ''
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.merge-git.outputs.target }}
        key: ${{ steps.merge-git.outputs.key }}
    - name: Build the pinned merge Git where the Git journeys look for it
      if: steps.merge-git.outputs.key != '' && steps.restore-merge-git.outputs.cache-hit != 'true'
      shell: bash
      env:
        SOURCE: ${{ steps.merge-git.outputs.source }}
        SHA: ${{ steps.merge-git.outputs.sha }}
        TARGET: ${{ steps.merge-git.outputs.target }}
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev xz-utils
        work="$RUNNER_TEMP/merge-git-build"
        mkdir -p "$work"
        curl --fail --location --retry 3 -o "$work/git.tar.xz" "$SOURCE"
        echo "$SHA  $work/git.tar.xz" | sha256sum --check --strict
        tar -xJf "$work/git.tar.xz" --strip-components=1 -C "$work"
        rm -rf "$TARGET"
        make -C "$work" -j"$(nproc)" prefix="$TARGET" NO_GETTEXT=YesPlease NO_TCLTK=YesPlease NO_PERL=YesPlease NO_RUST=YesPlease install
    - name: Check the pinned merge Git
      if: steps.merge-git.outputs.key != ''
      shell: bash
      env:
        VERSION: ${{ steps.merge-git.outputs.version }}
        TARGET: ${{ steps.merge-git.outputs.target }}
      run: '[[ $("$TARGET/bin/git" --version) == "git version $VERSION" ]] || { echo "::error::$TARGET/bin/git is not git version $VERSION."; exit 1; }'
    - if: steps.merge-git.outputs.key != '' && steps.restore-merge-git.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.merge-git.outputs.target }}
        key: ${{ steps.merge-git.outputs.key }}
    - name: Read the pinned Agave and platform tools versions
      id: solana-tools
      if: inputs.solana == 'true' && inputs.publication != 'true'
      shell: bash
      run: |
        set -euo pipefail
        fixture=packages/platform/src/testing/chains/validator.ts
        agave="$(sed -n 's/^export const SOLANA_TEST_VERSION = "\([0-9]\+\.[0-9]\+\.[0-9]\+\)";$/\1/p' "$fixture")"
        tools="$(sed -n 's/^const sbfTools = "\(v[0-9]\+\.[0-9]\+\)";$/\1/p' "$fixture")"
        [[ $agave == 2.1.21 ]] || { echo "::error::$fixture pins Agave '$agave'; this action verifies only the 2.1.21 release archive."; exit 1; }
        [[ -n $tools ]] || { echo "::error::$fixture names no platform tools version."; exit 1; }
        printf 'agave=%s\ntools=%s\nkey=solana-tools-%s-%s-agave-%s-%s\n' "$agave" "$tools" "$RUNNER_OS" "$RUNNER_ARCH" "$agave" "$tools" >> "$GITHUB_OUTPUT"
    - id: restore-solana-tools
      if: steps.solana-tools.outputs.key != ''
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/solana
        key: ${{ steps.solana-tools.outputs.key }}
    - name: Install the pinned Agave CLI, its program builder and platform tools
      if: steps.solana-tools.outputs.key != ''
      shell: bash
      env:
        AGAVE_VERSION: ${{ steps.solana-tools.outputs.agave }}
        SBF_TOOLS: ${{ steps.solana-tools.outputs.tools }}
      run: |
        set -euo pipefail
        target="$RUNNER_TEMP/agave-$AGAVE_VERSION"
        mkdir -p "$target/bin"
        curl --fail --location --retry 3 -o "$target/release.tar.bz2" "https://github.com/anza-xyz/agave/releases/download/v$AGAVE_VERSION/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
        echo "5da3359e296f1e6c13522b874317cb4cfe33e73301a9dc60b1e1435cc133b397  $target/release.tar.bz2" | sha256sum --check --strict
        tar -xjf "$target/release.tar.bz2" -C "$target" --no-same-owner
        ln -sfn "$target/solana-release/bin/solana" "$target/bin/solana"
        ln -sfn "$target/solana-release/bin/cargo-build-sbf" "$target/bin/cargo-build-sbf"
        export PATH="$target/bin:$PATH"
        echo "$target/bin" >> "$GITHUB_PATH"
        [[ $(solana --version) == "solana-cli $AGAVE_VERSION "* ]]
        [[ $(cargo-build-sbf --version) == "solana-cargo-build-sbf $AGAVE_VERSION"* ]]
        if command -v solana-test-validator; then echo "::error::A solana-test-validator on PATH would shadow the reviewed validator image."; exit 1; fi
        mkdir -p "$HOME/.cache/solana"
        cd packages/contracts/solana
        CARGO_TARGET_DIR="$PWD/.cache/target" cargo build-sbf --manifest-path programs/slop-escrow/Cargo.toml --tools-version "$SBF_TOOLS" --sbf-out-dir "$RUNNER_TEMP/sbf-tools-check" -- --locked
    - if: steps.solana-tools.outputs.key != '' && steps.restore-solana-tools.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/solana
        key: ${{ steps.solana-tools.outputs.key }}
    - name: Pull the reviewed Solana validator image
      if: steps.solana-tools.outputs.key != ''
      shell: bash
      run: |
        set -euo pipefail
        image="$(sed -n 's/^export const SOLANA_TEST_IMAGE = "\(docker\.io\/anzaxyz\/agave@sha256:[0-9a-f]\{64\}\)";$/\1/p' packages/platform/src/testing/chains/validator.ts)"
        test -n "$image"
        docker pull --platform linux/amd64 "$image"
        docker image inspect "$image" > /dev/null
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - id: pnpm-store
      if: inputs.publication != 'true' && inputs.job != 'contracts'
      shell: bash
      env:
        PNPM_SETUP_DIR: ${{ steps.setup-pnpm.outputs.dest }}
        LOCK_HASH: ${{ hashFiles('pnpm-lock.yaml') }}
      run: |
        store=$(pnpm store path --silent) || exit 0
        [[ $PNPM_SETUP_DIR == /* && ${store#"$PNPM_SETUP_DIR"/node_modules/.bin/store/v} =~ ^[0-9]+$ && $LOCK_HASH =~ ^[a-f0-9]{64}$ ]] || exit 0
        [[ $(realpath -m -- "$store") == "$store" ]] || exit 0
        arch=$(node -p 'process.arch')
        printf 'path=%s\nkey=node-cache-%s-%s-pnpm-%s\n' "$store" "$RUNNER_OS" "$arch" "$LOCK_HASH" >> "$GITHUB_OUTPUT"
    - id: restore-pnpm-store
      if: steps.pnpm-store.outputs.key != ''
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-store.outputs.key }}
    # Turborepo skips a task whose inputs it has seen; spec skips a simulation or proof it has seen, and the selftest's
    # shared projects skip a tool run an earlier selftest made (nightly, fuzz.yml runs it without them).
    # Quint downloads its evaluator to ~/.quint from GitHub's rate-limited API: once per cache, not per run.
    # Only restored here: ci.yml saves it at the end, except a complete fixture replay with a restored evaluator
    # or cancelled verification of a superseded default-branch push. A job tries both key layouts for this lockfile first.
    # Each entry is named by the tools and inputs that produced it. A selftest-* job holds the selftest's tool runs,
    # which no other job adds to, and any other job the spec caches of the projects, which no selftest-* job checks.
    - id: spec-cache
      if: inputs.verification == 'true' && inputs.cache-verification == 'true' && inputs.job != 'contracts'
      shell: bash
      env:
        JOB: ${{ inputs.job }}
      run: |
        [[ $JOB != simulate-* ]] || JOB=verify
        lock='${{ hashFiles('.nvmrc', 'pnpm-lock.yaml') }}'
        named="spec-${{ runner.os }}-${{ runner.arch }}-${JOB}-"
        prefix="${named}${lock}-"
        legacy="spec-${{ runner.os }}-${{ runner.arch }}-${lock}-${JOB}-"
        pr_prefix=
        if [[ $JOB == selftest-* && $GITHUB_EVENT_NAME == pull_request && $GITHUB_REF =~ ^refs/pull/([1-9][0-9]*)/merge$ ]]; then
          pr_prefix="${named}pr-${BASH_REMATCH[1]}-${lock}-"
        fi
        key="${pr_prefix:-$prefix}${{ github.sha }}-${{ github.run_attempt }}"
        [[ $key == spec-*-"$JOB"-*-${{ github.sha }}-${{ github.run_attempt }} ]] || { echo "::error::Malformed spec cache key '$key'"; exit 1; }
        {
          echo "restore<<EOF"
          if [[ -n $pr_prefix ]]; then printf '%s\n' "$pr_prefix"; fi
          printf '%s\n' "$prefix" "$legacy" "$named"
          echo "EOF"
          echo "pr-lock-prefix=$pr_prefix"
          echo "lock-prefix=$prefix"
          echo "legacy-lock-prefix=$legacy"
          echo "key=$key"
          echo "path<<EOF"
          if [[ $JOB == selftest-* ]]; then printf '%s\n' .cache/selftest/.spec-cache
          else printf '%s\n' .spec-cache 'apps/*/.spec-cache' 'packages/*/.spec-cache' vibestack/studio/.spec-cache 'vibestack/examples/*/.spec-cache'
          fi
          echo '~/.quint'
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - id: restore-spec-cache
      if: steps.spec-cache.outputs.key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.spec-cache.outputs.path }}
        key: ${{ steps.spec-cache.outputs.key }}
        restore-keys: ${{ steps.spec-cache.outputs.restore }}
    - id: turbo-cache
      if: inputs.publication != 'true' && inputs.job != 'contracts' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && inputs.job == 'verify' && env.TURBO_CACHE == 'local:rw'))
      shell: bash
      env:
        JOB: ${{ inputs.job }}
      run: echo "key=turbo-${{ runner.os }}-${{ runner.arch }}-${JOB}-${{ github.sha }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
    - if: steps.turbo-cache.outputs.key != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .turbo/cache
        key: ${{ steps.turbo-cache.outputs.key }}
        restore-keys: turbo-${{ runner.os }}-${{ runner.arch }}-${{ inputs.job }}-
    - id: gen-seed
      if: >-
        inputs.job == 'verify' && inputs.cache-verification == 'true' &&
        inputs.publication != 'true' &&
        env.TURBO_CACHE == 'local:rw' && steps.turbo-cache.outputs.key != ''
      shell: bash
      run: printf 'prefix=turbo-gen-v2-%s-%s-verify-\n' "$RUNNER_OS" "$RUNNER_ARCH" >> "$GITHUB_OUTPUT"
    - id: lookup-gen-seed
      if: steps.gen-seed.outputs.prefix != ''
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .turbo/gen-seed
        key: ${{ steps.gen-seed.outputs.prefix }}${{ github.sha }}
        restore-keys: |
          ${{ steps.gen-seed.outputs.prefix }}${{ github.sha }}-
          ${{ steps.gen-seed.outputs.prefix }}
        lookup-only: true
    - id: missing-gen-seed
      if: steps.lookup-gen-seed.outputs.cache-matched-key != ''
      shell: bash
      env:
        CACHE_KEY: ${{ steps.lookup-gen-seed.outputs.cache-matched-key }}
        PREFIX: ${{ steps.gen-seed.outputs.prefix }}
      run: |
        seed=${CACHE_KEY#"$PREFIX"}
        [[ $CACHE_KEY == "$PREFIX"* && $seed =~ ^[0-9a-f]{40}(-[0-9a-f]{16})+$ ]] || exit 0
        IFS=- read -ra hashes <<< "${seed#*-}"
        missing=()
        for hash in "${hashes[@]}"; do
          meta=".turbo/cache/$hash-meta.json"
          archive=".turbo/cache/$hash.tar.zst"
          if [[ ! -f $archive || ! -s $archive || ! -f $meta ]] || ! jq -e --arg hash "$hash" '.hash == $hash' "$meta" >/dev/null 2>&1; then
            missing+=("$hash")
          fi
        done
        printf 'hashes=%s\n' "${missing[*]}" >> "$GITHUB_OUTPUT"
    - id: restore-gen-seed
      if: steps.missing-gen-seed.outputs.hashes != ''
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .turbo/gen-seed
        key: ${{ steps.lookup-gen-seed.outputs.cache-matched-key }}
    - name: Import the early generation cache
      if: steps.restore-gen-seed.outputs.cache-hit == 'true'
      continue-on-error: true
      shell: bash
      env:
        HASHES: ${{ steps.missing-gen-seed.outputs.hashes }}
      run: |
        mkdir -p .turbo/cache
        read -ra hashes <<< "$HASHES"
        for hash in "${hashes[@]}"; do
          archive=".turbo/gen-seed/$hash.tar.zst"
          meta=".turbo/gen-seed/$hash-meta.json"
          [[ -f $archive && -s $archive && -f $meta && -s $meta ]] || continue
          jq -e --arg hash "$hash" '.hash == $hash' "$meta" >/dev/null || continue
          rm -f ".turbo/cache/$hash-manifest.json"
          mv "$archive" "$meta" .turbo/cache/
        done
    - name: Install workspace dependencies
      id: install-workspace
      if: inputs.publication != 'true' && inputs.job != 'contracts'
      shell: bash
      env:
        PUBLISH_GEN_SEED: ${{ inputs.verification == 'true' && steps.gen-seed.outputs.prefix != '' }}
        REMEMBER_RESTORED_EVALUATORS: >-
          ${{ startsWith(inputs.job, 'selftest-') &&
              steps.restore-spec-cache.outcome == 'success' && steps.restore-spec-cache.outputs.cache-matched-key != '' &&
              ((github.event_name == 'pull_request' && steps.spec-cache.outputs.pr-lock-prefix != '' &&
                startsWith(steps.restore-spec-cache.outputs.cache-matched-key, steps.spec-cache.outputs.pr-lock-prefix)) ||
               (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
                steps.spec-cache.outputs.lock-prefix != '' && steps.spec-cache.outputs.legacy-lock-prefix != '' &&
                (startsWith(steps.restore-spec-cache.outputs.cache-matched-key, steps.spec-cache.outputs.lock-prefix) ||
                 startsWith(steps.restore-spec-cache.outputs.cache-matched-key, steps.spec-cache.outputs.legacy-lock-prefix)))) }}
      run: |
        if [[ $REMEMBER_RESTORED_EVALUATORS == true ]]; then
          {
            echo 'evaluators<<EOF'
            for evaluator in "$HOME"/.quint/rust-evaluator-*/quint_evaluator; do
              [[ -f $evaluator && -x $evaluator && ! -L $evaluator ]] || continue
              stat -c '%d:%i:%s:%y:%z' -- "$evaluator" || true
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"
        fi
        if [[ $PUBLISH_GEN_SEED == true ]]; then export TURBO_RUN_SUMMARY=true; fi
        pnpm install --frozen-lockfile
    - id: publish-gen-seed
      if: inputs.verification == 'true' && steps.gen-seed.outputs.prefix != ''
      continue-on-error: true
      shell: bash
      env:
        PREFIX: ${{ steps.gen-seed.outputs.prefix }}
      run: |
        shopt -s nullglob
        reports=(.turbo/runs/*.json)
        (( ${#reports[@]} )) || exit 0
        seed=$(jq -sr '
          map(select(.version == "1" and (.execution.command == "turbo run //#gen" or .execution.command == "turbo run //#build") and .execution.exitCode == 0))
          | select(length == 1) | .[0].tasks
          | map(select(.taskId | test("#gen($|:)")))
          | select(any(.[]; .taskId == "//#gen") and any(.[]; .cache.status == "MISS"))
          | select(all(.[]; .execution.exitCode == 0 and (.cache.status == "HIT" or .cache.status == "MISS")))
          | sort_by(.taskId != "//#gen", .taskId) | map(.hash) | join("-")
        ' "${reports[@]}") || exit 0
        [[ $seed =~ ^[0-9a-f]{16}(-[0-9a-f]{16})*$ ]] || exit 0
        key="$PREFIX$GITHUB_SHA-"
        if (( ${#key} + ${#seed} > 512 )); then seed=${seed%%-*}; fi
        IFS=- read -ra hashes <<< "$seed"
        rm -rf .turbo/gen-seed
        mkdir -p .turbo/gen-seed
        for hash in "${hashes[@]}"; do
          archive=".turbo/cache/$hash.tar.zst"
          meta=".turbo/cache/$hash-meta.json"
          [[ -f $archive && -s $archive && -f $meta && -s $meta ]] || exit 0
          jq -e --arg hash "$hash" '.hash == $hash' "$meta" >/dev/null || exit 0
          cp "$archive" "$meta" .turbo/gen-seed/
        done
        printf 'key=%s%s\n' "$key" "$seed" >> "$GITHUB_OUTPUT"
    - if: steps.publish-gen-seed.outputs.key != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: .turbo/gen-seed
        key: ${{ steps.publish-gen-seed.outputs.key }}
    - if: inputs.publication == 'true'
      run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
    - id: lookup-pnpm-store
      if: >-
        inputs.job == 'verify' && inputs.verification == 'true' && inputs.cache-verification == 'true' &&
        github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        steps.pnpm-store.outputs.key != '' && steps.restore-pnpm-store.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-store.outputs.key }}
        lookup-only: true
    - if: steps.lookup-pnpm-store.outcome == 'success' && steps.lookup-pnpm-store.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-store.outputs.key }}
    - name: Read the pinned Quint evaluator version
      id: quint-evaluator
      if: inputs.verification == 'true' && inputs.job != 'contracts'
      shell: bash
      run: |
        version=$(node -p "require('@informalsystems/quint/dist/src/rust/binaryManager.js').QUINT_EVALUATOR_VERSION")
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - id: quint-cache
      if: steps.quint-evaluator.outputs.version != '' && inputs.cache-verification == 'false'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.quint/rust-evaluator-${{ steps.quint-evaluator.outputs.version }}
        key: quint-evaluator-${{ runner.os }}-${{ runner.arch }}-${{ steps.quint-evaluator.outputs.version }}
    # Quint's first-run downloader uses the unauthenticated GitHub API.
    # Fetch its pinned release directly before concurrent checks need it.
    - name: Install Quint evaluator
      id: install-quint-evaluator
      if: steps.quint-evaluator.outputs.version != ''
      env:
        EVALUATOR_VERSION: ${{ steps.quint-evaluator.outputs.version }}
        RESTORED_EVALUATORS: ${{ steps.install-workspace.outputs.evaluators }}
      run: |
        evaluator_dir="$HOME/.quint/rust-evaluator-$EVALUATOR_VERSION"
        if [ ! -x "$evaluator_dir/quint_evaluator" ]; then
          mkdir -p "$evaluator_dir"
          curl --fail --location --retry 3 "https://github.com/quint-co/quint/releases/download/evaluator/$EVALUATOR_VERSION/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$evaluator_dir"
        elif [[ -n $RESTORED_EVALUATORS ]] &&
          stamp=$(stat -c '%d:%i:%s:%y:%z' -- "$evaluator_dir/quint_evaluator") &&
          grep -Fxq -- "$stamp" <<< "$RESTORED_EVALUATORS"; then
          echo 'spec-evaluator-restored=true' >> "$GITHUB_OUTPUT"
        fi
        "$evaluator_dir/quint_evaluator" --help
      shell: bash
    - if: inputs.job == 'verify' && steps.quint-cache.outputs.cache-primary-key != '' && steps.quint-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.quint/rust-evaluator-${{ steps.quint-evaluator.outputs.version }}
        key: ${{ steps.quint-cache.outputs.cache-primary-key }}
    - name: Install Chromium
      if: inputs.verification == 'true' && inputs.job != 'contracts' && inputs.job != 'selftest-b' && inputs.job != 'selftest-rest' && !startsWith(inputs.job, 'simulate-')
      run: |
        node --input-type=module - "${{ inputs.job == 'selftest-a' }}" "${{ inputs.job == 'verify' }}" "${{ inputs.cache-verification == 'true' }}" <<'JS'
        import { installChromium, prepareChromiumShell } from "./vibestack/chromium.ts";
        import { hostedCachedFixture } from "./vibestack/selftests/install.ts";
        const [fullOnly, verify, cacheVerification] = process.argv.slice(2);
        if (fullOnly === "true") {
          if (cacheVerification !== "true" || !hostedCachedFixture()) await installChromium("full");
        } else if (verify !== "true" || cacheVerification !== "true" || !await prepareChromiumShell()) {
          await installChromium("both");
        }
        JS
      shell: bash
