name: Windows installer contract

on:
  pull_request:
    branches: [develop, development, main]
    paths:
      - ".github/workflows/windows-installer.yml"
      - "skills/project-contributor-template/**"
      - "scripts/run-e2e-phase.mjs"
      - "scripts/e2e-runner.test.ts"
      - "tests/fixture-overlay.mjs"
      - "tests/fixtures/project-registry.mjs"
      - "src/lib/install-command.ts"
      - "tests/integration/installer.e2e.ts"
      - "tests/install-authority-fixture.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Native Windows installer lifecycle
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Restore Bun dependency cache
        # CI check cache only (owner decision, 29 October 2026, #1467 3.10(d)).
        # Jobs that build the release bundle, deploy or hold secrets never use it.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install frozen dependencies without lifecycle scripts
        shell: bash
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Stop timed-out process trees and preserve phase failures
        shell: bash
        # Includes cold process startup, bounded tree termination and exit wait.
        run: bun test ./scripts/e2e-runner.test.ts --timeout 30000

      - name: Exercise install, update, rollback, active reads, and locking
        shell: bash
        # Bun's default is a five-second per-test ceiling; zero disables it.
        run: bun test ./tests/integration/installer.e2e.ts --timeout 0

