name: Publish reviewed historical project Points
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose read-only assessment audit, replay, or reviewed Points publication"
        type: choice
        options:
          - publish-reviewed
          - audit-assessments
          - replay-assessments
        default: publish-reviewed
      audit_project:
        description: "Registered project ID for the assessment audit"
        type: string
      audit_source_sha256:
        description: "SHA-256 of the complete canonical GitHub source census"
        type: string
      audit_baseline_sha256:
        description: "SHA-256 of the current canonical Points checkpoint"
        type: string
      stage_review_handoff:
        description: "Retain the qualified replay inputs in encrypted private storage for owner review"
        type: boolean
        default: false
      require_no_active_assessments:
        description: "Use the separate queue and refuse any replay with active assessments in scope"
        type: boolean
        default: false
      reviewed_packet_sha256:
        description: "Owner-reviewed SHA-256 of the private canonical project packet"
        type: string
      apply:
        description: "Publish the reviewed historical Points extension"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ inputs.operation == 'replay-assessments' && (inputs.require_no_active_assessments && 'slop-historical-catalog-replay' || 'slop-quality-refs/heads/main-collect') || 'slop-production' }}
  cancel-in-progress: false
env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE: "local:rw"
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    environment: slop-production
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.operation == 'replay-assessments' && !inputs.require_no_active_assessments && 360 || 90 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check which protected operation was requested
        env:
          OPERATION: ${{ inputs.operation }}
          APPLY: ${{ inputs.apply }}
          STAGE_REVIEW: ${{ inputs.stage_review_handoff }}
          REQUIRE_NO_ACTIVE_ASSESSMENTS: ${{ inputs.require_no_active_assessments }}
          PACKET_SHA: ${{ inputs.reviewed_packet_sha256 }}
          AUDIT_PROJECT: ${{ inputs.audit_project }}
          AUDIT_SOURCE_SHA: ${{ inputs.audit_source_sha256 }}
          AUDIT_BASELINE_SHA: ${{ inputs.audit_baseline_sha256 }}
        run: |
          set -euo pipefail
          if [ "$STAGE_REVIEW" = true ] || [ "$REQUIRE_NO_ACTIVE_ASSESSMENTS" = true ]; then
            test "$OPERATION" = replay-assessments
          fi
          case "$OPERATION" in
            audit-assessments|replay-assessments)
              test "$APPLY" = false
              test -z "$PACKET_SHA"
              [[ "$AUDIT_PROJECT" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]
              [[ "$AUDIT_SOURCE_SHA" =~ ^[a-f0-9]{64}$ ]]
              [[ "$AUDIT_BASELINE_SHA" =~ ^[a-f0-9]{64}$ ]]
              ;;
            publish-reviewed)
              test -z "$AUDIT_PROJECT$AUDIT_SOURCE_SHA$AUDIT_BASELINE_SHA"
              [[ "$PACKET_SHA" =~ ^[a-f0-9]{64}$ ]]
              ;;
            *) exit 1 ;;
          esac
      - uses: ./.github/actions/setup
        with:
          job: reviewed-historical-points
          verification: "false"
          publication: "true"
      - name: Reject known production dependency vulnerabilities
        run: |
          set -euo pipefail
          pnpm audit --prod
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const lock = readFileSync("pnpm-lock.yaml", "utf8");
          const section = (name) => {
            const start = lock.indexOf(`\n${name}:\n`);
            if (start < 0) return "";
            const rest = lock.slice(start + name.length + 3);
            const end = rest.search(/\n[A-Za-z]/u);
            return end < 0 ? rest : rest.slice(0, end);
          };
          const reviewed = ["2.3.2", "4.0.7"];
          const hashes = new Map([...section("patchedDependencies").matchAll(/^  picomatch@([^:\s]+):\n    hash: ([0-9a-f]{64})$/gmu)].map((match) => [match[1], match[2]]));
          const copies = [...section("packages").matchAll(/^  '?picomatch@([^:(\s']+)[^\n]*:$/gmu)].map((match) => match[1]).sort();
          const references = [...section("snapshots").matchAll(/picomatch(?:@|: )(\d+\.\d+\.\d+)(?:\(patch_hash=([0-9a-f]{64})\))?/gu)];
          if (
            hashes.size !== reviewed.length ||
            !reviewed.every((version) => hashes.has(version)) ||
            JSON.stringify(copies) !== JSON.stringify(reviewed) ||
            references.length === 0 ||
            references.some((match) => match[2] === undefined || hashes.get(match[1]) !== match[2])
          ) {
            console.error("::error::The lockfile has unexpected Picomatch copies.");
            process.exit(1);
          }
          NODE
      - run: pnpm all build --filter=@repo/operations --filter=@repo/points --filter=@repo/slopbot
      - name: Snapshot the current project registry for verification
        run: |
          set -euo pipefail
          node apps/operations/dist/programs/main.js release registry production "$RUNNER_TEMP/slop-release"
          node apps/points/dist/programs/main.js registry "$RUNNER_TEMP/slop-release/registry/snapshot.json" "$RUNNER_TEMP/repository-registry.json"
      - name: Install canonical Git build dependencies
        if: inputs.operation != 'audit-assessments'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev xz-utils
      - name: Install canonical merge Git
        if: inputs.operation != 'audit-assessments'
        run: |
          set -euo pipefail
          node apps/points/dist/programs/main.js git install "$RUNNER_TEMP/value-merge-git"
          printf '%s\n' "$RUNNER_TEMP/value-merge-git/bin" >> "$GITHUB_PATH"
      - name: Mint the read-only collector token for assessment source reads
        id: collector-token
        if: (inputs.operation == 'audit-assessments' || inputs.operation == 'replay-assessments') && vars.COLLECTOR_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.COLLECTOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.COLLECTOR_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - name: Read and verify the complete historical assessment catalog
        if: inputs.operation != 'publish-reviewed'
        env:
          OPERATION: ${{ inputs.operation }}
          COLLECTOR_APP_CLIENT_ID: ${{ steps.collector-token.outputs.installation-id && vars.COLLECTOR_APP_CLIENT_ID || '' }}
          COLLECTOR_APP_PRIVATE_KEY: ${{ steps.collector-token.outputs.installation-id && secrets.COLLECTOR_APP_PRIVATE_KEY || '' }}
          COLLECTOR_APP_INSTALLATION_ID: ${{ steps.collector-token.outputs.installation-id }}
          COLLECTOR_APP_REPOSITORY: ${{ github.event.repository.name }}
          GH_TOKEN: ${{ steps.collector-token.outputs.token || github.token }}
          GITHUB_TOKEN: ${{ steps.collector-token.outputs.token || github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HISTORICAL_POINTS_APPLY: ${{ inputs.apply }}
          HISTORICAL_ASSESSMENT_STAGE_REVIEW: ${{ inputs.stage_review_handoff }}
          HISTORICAL_ASSESSMENT_REQUIRE_NO_ACTIVE: ${{ inputs.require_no_active_assessments }}
          PRIVATE_PACKET_ENCRYPTION_KEY: ${{ inputs.operation == 'replay-assessments' && inputs.stage_review_handoff && secrets.PRIVATE_PACKET_ENCRYPTION_KEY || '' }}
          REVIEWED_PACKET_SHA256: ${{ inputs.reviewed_packet_sha256 }}
          HISTORICAL_ASSESSMENT_PROJECT: ${{ inputs.audit_project }}
          HISTORICAL_SOURCE_AUDIT_SHA256: ${{ inputs.audit_source_sha256 }}
          HISTORICAL_POINTS_BASELINE_SHA256: ${{ inputs.audit_baseline_sha256 }}
        run: |
          set -euo pipefail
          if [ "$OPERATION" = replay-assessments ]; then
            node apps/slopbot/dist/programs/main.js reviewed-replay "$RUNNER_TEMP/repository-registry.json"
          else
            node apps/points/dist/programs/main.js reviewed --audit-assessments
          fi
      - name: Preserve the assessment audit receipt
        if: inputs.operation != 'publish-reviewed'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: historical-assessment-${{ inputs.operation == 'replay-assessments' && 'replay' || 'audit' }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/historical-assessment-audit/receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Rebuild and verify owner-reviewed historical Points
        if: inputs.operation == 'publish-reviewed'
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORICAL_REPLAY_ACTIONS_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRIVATE_PACKET_TRANSPORT: bound-preview
          PRIVATE_PACKET_ENCRYPTION_KEY: ${{ secrets.PRIVATE_PACKET_ENCRYPTION_KEY }}
          SLOPBOT_APP_ID: ${{ secrets.SLOPBOT_APP_ID }}
          SLOPBOT_APP_PRIVATE_KEY: ${{ secrets.SLOPBOT_APP_PRIVATE_KEY }}
          HISTORICAL_POINTS_OBJECT_MANIFEST: ${{ secrets.HISTORICAL_POINTS_OBJECT_MANIFEST }}
          HISTORICAL_POINTS_PACKET_1: ${{ secrets.HISTORICAL_POINTS_PACKET_1 }}
          HISTORICAL_POINTS_PACKET_2: ${{ secrets.HISTORICAL_POINTS_PACKET_2 }}
          HISTORICAL_POINTS_PACKET_3: ${{ secrets.HISTORICAL_POINTS_PACKET_3 }}
          HISTORICAL_POINTS_PACKET_4: ${{ secrets.HISTORICAL_POINTS_PACKET_4 }}
          REVIEWED_PACKET_SHA256: ${{ inputs.reviewed_packet_sha256 }}
          HISTORICAL_POINTS_APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          reviewed=(node apps/points/dist/programs/main.js reviewed "$RUNNER_TEMP/repository-registry.json" --reviewed-sha256 "$REVIEWED_PACKET_SHA256")
          if [ "$HISTORICAL_POINTS_APPLY" = true ]; then reviewed+=(--apply); fi
          "${reviewed[@]}"
