name: Inspect production fee-worker bindings
on:
  workflow_dispatch:
    inputs:
      slopbot_source:
        description: Optional exact deployed Slopbot source SHA for a separate read-only CPU metadata receipt
        type: string
        default: ""
      probe_solana_rpc:
        description: Read-only Cloudflare-egress check of the staged Helius candidate and public recovery RPC
        type: boolean
        default: false
      rotate_solana_from:
        description: Replace only Solana RPC bindings from this exact active fee Worker version
        type: string
        default: ""
      rotate_solana_source:
        description: Exact deployed source commit whose fee runtime must match this checkout
        type: string
        default: ""
      prior_proof_run:
        description: Optional same-workflow failed run stopped before its Solana rotation lease
        type: string
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    environment: slop-production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: slop-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install the pinned rotation tools
        if: inputs.rotate_solana_from != ''
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Inspect exact active version without reading secret values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun --no-env-file scripts/inspect-fee-worker-bindings.ts
      - name: Inspect fee schedules and bounded operational state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun --no-env-file scripts/inspect-fee-worker-operations.ts
      - name: Probe Solana RPCs from an unbound remote preview
        if: inputs.probe_solana_rpc == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOP_SOLANA_RPC_CANDIDATE: ${{ secrets.SLOP_SOLANA_RPC_CANDIDATE }}
        run: bun --no-env-file scripts/probe-fee-solana-rpc.ts
      - name: Retain the exact prior witness from this workflow
        if: inputs.rotate_solana_from != '' && inputs.prior_proof_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN: ${{ inputs.prior_proof_run }}
        run: |
          set -euo pipefail
          [[ "$PRIOR_RUN" =~ ^[1-9][0-9]*$ ]]
          current_workflow="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN" > "$RUNNER_TEMP/prior-run.json"
          prior_sha="$(bun -e 'const r=await Bun.file(process.argv[1]).json(); if(r.workflow_id!==Number(process.argv[2]) || r.event!=="workflow_dispatch" || r.head_branch!=="main" || r.status!=="completed" || r.conclusion!=="failure" || !/^[a-f0-9]{40}$/.test(r.head_sha))process.exit(1); console.log(r.head_sha)' "$RUNNER_TEMP/prior-run.json" "$current_workflow")"
          gh run download "$PRIOR_RUN" --repo "$GITHUB_REPOSITORY" --name "fee-worker-bindings-$prior_sha" --dir "$RUNNER_TEMP/prior-solana-proof"
          {
            echo "SLOP_SOLANA_RPC_PRIOR_PROOF_DIRECTORY=$RUNNER_TEMP/prior-solana-proof"
            echo "SLOP_SOLANA_RPC_PRIOR_SOURCE=$prior_sha"
            echo "SLOP_SOLANA_RPC_PRIOR_RUN=$PRIOR_RUN"
          } >> "$GITHUB_ENV"
      - name: Qualify and rotate only the Solana RPC pair
        if: inputs.rotate_solana_from != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOP_FEE_CONVERTER_RELEASE: ${{ vars.SLOP_FEE_CONVERTER_RELEASE }}
          SLOP_SOLANA_RPC_CANDIDATE: ${{ secrets.SLOP_SOLANA_RPC_CANDIDATE }}
          SLOP_SOLANA_RPC_EXPECTED_VERSION: ${{ inputs.rotate_solana_from }}
          SLOP_SOLANA_RPC_EXPECTED_SOURCE: ${{ inputs.rotate_solana_source }}
        run: bun --no-env-file scripts/rotate-fee-solana-rpc.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fee-worker-bindings-${{ github.sha }}
          path: |
            ${{ runner.temp }}/fee-worker-bindings.json
            ${{ runner.temp }}/fee-worker-operations.json
            ${{ runner.temp }}/fee-solana-rpc-probe.json
            ${{ runner.temp }}/fee-solana-rpc-rotation.json
            ${{ runner.temp }}/solana-rpc-rotation-proof.json
          if-no-files-found: error
          retention-days: 30
  inspect-slopbot:
    if: github.ref == 'refs/heads/main' && inputs.slopbot_source != ''
    environment: slop-production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Read fixed active Slopbot CPU metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOP_SLOPBOT_EXPECTED_SOURCE: ${{ inputs.slopbot_source }}
        run: bun --no-env-file scripts/inspect-slopbot-runtime.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: slopbot-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/slopbot-runtime.json
          if-no-files-found: error
          retention-days: 30
