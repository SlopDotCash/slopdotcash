name: Scheduled watches

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Scheduled operation to run now
        type: choice
        options: [production-watch, intake-watch, referral-roots]
        default: production-watch

permissions:
  contents: read

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE: "local:rw"

jobs:
  production-watch:
    name: Production watch
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '17 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'production-watch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: slop-production-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: production-watch
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/operations
      - name: Check public uptime and cached vault freshness
        run: node apps/operations/dist/programs/main.js watch production

  intake-watch:
    name: Private intake health watch
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '47 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'intake-watch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: slop-intake-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: intake-watch
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/operations
      - name: Read optional intake health
        run: node apps/operations/dist/programs/main.js watch intake

  referral-roots:
    name: Referral root watch
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '47 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'referral-roots'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: slop-referral-root-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: referral-roots
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/settlement
      - name: Rebuild public files and compare canonical roots
        run: node apps/settlement/dist/programs/main.js referral-roots
