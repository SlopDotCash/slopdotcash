name: Scheduled watches and monthly allocations

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
    - cron: "11 0 1-3 * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Scheduled operation to run now
        type: choice
        options: [production-watch, intake-watch, referral-roots, monthly-allocation]
        default: production-watch
      cycle:
        description: "Monthly allocation only: closed UTC month to propose (YYYY-MM); blank means the previous month"
        type: string
        default: ""

permissions:
  contents: read

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE: "local:rw"

jobs:
  production-watch:
    name: Production watch
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '17 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'production-watch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: slop-production-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: production-watch
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/operations
      - name: Check public uptime and cached vault freshness
        run: node apps/operations/dist/programs/main.js watch production

  intake-watch:
    name: Private intake health watch
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '47 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'intake-watch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: slop-intake-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: intake-watch
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/operations
      - name: Read optional intake health
        run: node apps/operations/dist/programs/main.js watch intake

  referral-roots:
    name: Referral root watch
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '47 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'referral-roots'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: slop-referral-root-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: referral-roots
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/settlement
      - name: Rebuild public files and compare canonical roots
        run: node apps/settlement/dist/programs/main.js referral-roots

  monthly-dispatch:
    name: Dispatch monthly allocations on main and development
    if: github.event_name == 'schedule' && github.event.schedule == '11 0 1-3 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch on main and development
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=0
          for ref in main development; do
            if gh workflow run scheduled.yml --repo "$GITHUB_REPOSITORY" --ref "$ref" -f operation=monthly-allocation; then
              echo "Dispatched monthly allocations on $ref."
            else
              echo "::error::Could not dispatch monthly allocations on $ref."
              status=1
            fi
          done
          exit "$status"

  monthly-allocation:
    name: Propose monthly allocations
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.operation == 'monthly-allocation' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: slop-monthly-allocations-${{ github.ref }}
      cancel-in-progress: false
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'slop-production' || 'slop-staging' }}
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted checkout
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Monthly allocation checkout $checked_out_sha does not match event SHA $GITHUB_SHA."
            exit 1
          fi
      - uses: ./.github/actions/setup
        with:
          job: monthly-allocation
          verification: "false"
          publication: "true"
      - name: Reject known production dependency vulnerabilities
        run: pnpm audit --prod
      - run: pnpm all build --filter=@repo/settlement
      - name: Validate requested cycle
        id: cycle
        env:
          REQUESTED_CYCLE: ${{ inputs.cycle }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_CYCLE" ] && ! [[ "$REQUESTED_CYCLE" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::Cycle must be YYYY-MM."
            exit 1
          fi
          echo "cycle=$REQUESTED_CYCLE" >> "$GITHUB_OUTPUT"
      - name: Propose private allocations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOP_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          CYCLE: ${{ steps.cycle.outputs.cycle }}
        run: |
          set -euo pipefail
          if [ -n "$CYCLE" ]; then
            node apps/settlement/dist/programs/main.js propose-month --cycle "$CYCLE"
          else
            node apps/settlement/dist/programs/main.js propose-month
          fi
