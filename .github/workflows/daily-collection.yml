name: Daily contribution collection

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "Blank starts the daily collection. A main release run ID does that release's follow-up."
        required: false
        type: string
        default: ""
  workflow_run:
    workflows: [slop.cash]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE: "local:rw"

jobs:
  start:
    name: Start the daily collection
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_run_id == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    concurrency:
      group: slop-daily-collection-start
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/main' || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: daily-collection
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/operations
      - name: Mint dispatch token
        id: dispatch-token
        if: vars.SCAN_DISPATCH_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.SCAN_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCAN_DISPATCH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
      - name: Dispatch a fresh collection unless one is running
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISPATCH_APP_CLIENT_ID: ${{ steps.dispatch-token.outputs.installation-id && vars.SCAN_DISPATCH_APP_CLIENT_ID || '' }}
          DISPATCH_APP_PRIVATE_KEY: ${{ steps.dispatch-token.outputs.installation-id && secrets.SCAN_DISPATCH_APP_PRIVATE_KEY || '' }}
          DISPATCH_APP_INSTALLATION_ID: ${{ steps.dispatch-token.outputs.installation-id }}
        run: node apps/operations/dist/programs/main.js release daily start

  follow-up:
    name: Publish or resume a main collection
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.id == github.event.repository.id &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       inputs.release_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      actions: write
      contents: read
    concurrency:
      group: slop-collection-follow-up-${{ github.event.workflow_run.id || inputs.release_run_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: daily-collection
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/operations
      - name: Mint dispatch token
        id: dispatch-token
        if: vars.SCAN_DISPATCH_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.SCAN_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCAN_DISPATCH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
      - name: Publish a superseded collection or resume a failed one
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISPATCH_APP_CLIENT_ID: ${{ steps.dispatch-token.outputs.installation-id && vars.SCAN_DISPATCH_APP_CLIENT_ID || '' }}
          DISPATCH_APP_PRIVATE_KEY: ${{ steps.dispatch-token.outputs.installation-id && secrets.SCAN_DISPATCH_APP_PRIVATE_KEY || '' }}
          DISPATCH_APP_INSTALLATION_ID: ${{ steps.dispatch-token.outputs.installation-id }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id || inputs.release_run_id }}
        run: node apps/operations/dist/programs/main.js release daily follow-up "$RELEASE_RUN_ID"
