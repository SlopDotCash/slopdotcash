name: Inspect historical value intake
on:
  workflow_dispatch:
    inputs:
      correlation:
        description: Optional 64 lowercase hex nonce for one live Pages intake
        type: string
        default: ""
      history_from:
        description: Optional UTC start for retained sanitized failures (paired bounds, at most 15 minutes within the last 24 hours)
        type: string
        default: ""
      history_to:
        description: Optional UTC end for retained sanitized failures
        type: string
        default: ""
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    environment: slop-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Refuse mixed live correlation and retained-history modes
        if: inputs.correlation != '' && (inputs.history_from != '' || inputs.history_to != '')
        run: |
          echo "::error::A correlation selects live Pages diagnostics only."
          exit 1
      - name: Read bounded sanitized intake observations
        if: inputs.history_from == '' && inputs.history_to == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOP_INTAKE_CORRELATION: ${{ inputs.correlation }}
        run: bun --no-env-file scripts/inspect-value-intake.ts
      - name: Read bounded retained sanitized failures
        if: inputs.history_from != '' || inputs.history_to != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOP_INTAKE_HISTORY_FROM: ${{ inputs.history_from }}
          SLOP_INTAKE_HISTORY_TO: ${{ inputs.history_to }}
        run: bun --no-env-file scripts/inspect-value-intake-history.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: value-intake-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/value-intake-diagnostic.json
            ${{ runner.temp }}/value-intake-history.json
          if-no-files-found: error
          retention-days: 7
