name: Prepare reviewed ASI November closeout
on:
  workflow_dispatch:
    inputs:
      reviewed_packet_sha256:
        description: "Exact SHA-256 of the owner-reviewed private ASI packet, required for preview and apply"
        type: string
      preview_sha256:
        description: "Exact SHA-256 returned by the reviewed preview, required to apply"
        type: string
      mode:
        description: "Inspect input digests, preview the reviewed proposal, or apply the approved preview"
        type: choice
        options:
          - inspect
          - preview
          - apply
        default: inspect
permissions:
  contents: read
concurrency:
  group: slop-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    environment: slop-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run audit:dependencies
      - name: Validate and optionally import the private closeout proposal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOPBOT_APP_ID: ${{ secrets.SLOPBOT_APP_ID }}
          SLOPBOT_APP_PRIVATE_KEY: ${{ secrets.SLOPBOT_APP_PRIVATE_KEY }}
          ASI_CLOSEOUT_REVIEWED_PACKET: ${{ secrets.ASI_CLOSEOUT_REVIEWED_PACKET }}
          REVIEWED_PACKET_SHA256: ${{ inputs.reviewed_packet_sha256 }}
          ASI_CLOSEOUT_PREVIEW_SHA256: ${{ inputs.preview_sha256 }}
          ASI_CLOSEOUT_MODE: ${{ inputs.mode }}
        run: bun --no-env-file scripts/run-asi-november-closeout.ts
