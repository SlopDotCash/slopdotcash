name: Trusted payment reservation gate

on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: trusted-payment-reservations-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  payment-reservations:
    name: Trusted payment reservation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable trusted base only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install trusted dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify the global append-only payment ledger
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/origin/payment-reservation-head"
          test "$(git rev-parse refs/remotes/origin/payment-reservation-head)" = "$HEAD_SHA"
          bun --no-install scripts/check-payment-reservations.ts "$BASE_SHA" "$HEAD_SHA"
      - name: Record exact verified PR inputs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("payment-admission.json", JSON.stringify({base:process.env.BASE_SHA,head:process.env.HEAD_SHA,number:Number(process.env.PR_NUMBER),runId:Number(process.env.GITHUB_RUN_ID),attempt:Number(process.env.GITHUB_RUN_ATTEMPT)}))'
      - name: Preserve trusted admission receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: payment-admission-${{ github.run_attempt }}
          path: payment-admission.json
          if-no-files-found: error
          retention-days: 90
