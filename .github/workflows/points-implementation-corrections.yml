name: Rebalance historical implementation Points

# Allocation only: preserve recorded value, contribution dates, source keys and
# frozen financial obligations. No schedule, external manifest or fork input.
on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project ID in the current D1 registry"
        required: true
        type: string
      month:
        description: "Optional single UTC census month (YYYY-MM); blank collects the complete census"
        type: string
      candidate_month:
        description: "Optional correction month (YYYY-MM); other pools retain explicit dispositions"
        type: string
      before:
        description: "Optional canonical UTC cutoff; blank uses the collector's historical cutoff"
        type: string
      resume_run:
        description: "Optional prior run of this workflow at the current main SHA or a main ancestor"
        type: string
      graphql_discussions:
        description: "Try complete GraphQL PR discussions for newly collected sources, with REST fallback"
        type: boolean
        default: false
      october_original_credit:
        description: "Use the reviewed October 2026 replacement-PR rule"
        type: boolean
        default: false
      apply:
        description: "Record eligible corrections after complete evidence and private financial checks"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: slop-historical-points-${{ inputs.project }}
  cancel-in-progress: false

env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"
  VITE_SLOP_ENVIRONMENT: production

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact_id: ${{ steps.retain-campaign.outputs.artifact-id }}
      producer_sha: ${{ steps.complete-preview.outputs.reused == 'true' && steps.resume-source.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Snapshot authoritative project registry
        env:
          SLOP_API_ORIGIN: https://slop.cash
        run: bun run projects:sync
      - name: Verify the resume source is trusted main-history evidence
        id: resume-source
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/implementation-campaign"
          if [ -n "$RESUME_RUN" ]; then
            [[ "$RESUME_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN" > "$RUNNER_TEMP/resume-run.json"
            resume_sha="$(node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const run = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/resume-run.json`, 'utf8'));
          const repository = process.env.GITHUB_REPOSITORY;
          if (typeof repository !== 'string' || !/^[^/]+\/[^/]+$/.test(repository) ||
              !/^[a-f0-9]{40}$/.test(run.head_sha ?? '') ||
              !/^[a-f0-9]{40}$/.test(process.env.GITHUB_SHA ?? '') ||
              run.repository?.full_name !== repository || run.head_repository?.full_name !== repository ||
              run.head_branch !== 'main' ||
              run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/points-implementation-corrections.yml')
            throw new Error('Resume evidence does not belong to this trusted main collector');
          const ancestor = spawnSync('git', ['merge-base', '--is-ancestor', run.head_sha, process.env.GITHUB_SHA], { stdio: 'ignore' });
          if (ancestor.status !== 0)
            throw new Error('Resume source is not in the current main history');
          process.stdout.write(run.head_sha);
          NODE
            )"
            echo "sha=$resume_sha" >> "$GITHUB_OUTPUT"
          fi
      - name: Reuse a compatible completed collection for preview
        id: complete-preview
        if: inputs.resume_run != '' && !inputs.apply && inputs.month == '' && inputs.candidate_month == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
          RESUME_SHA: ${{ steps.resume-source.outputs.sha }}
          PROJECT: ${{ inputs.project }}
          BEFORE: ${{ inputs.before }}
          OCTOBER_ORIGINAL_CREDIT: ${{ inputs.october_original_credit }}
        run: |
          set -euo pipefail
          resume_status="$(jq -r '.status' "$RUNNER_TEMP/resume-run.json")"
          resume_attempt="$(jq -r '.run_attempt' "$RUNNER_TEMP/resume-run.json")"
          if [[ "$resume_status" != completed || ! "$resume_attempt" =~ ^[1-9][0-9]*$ ]]; then
            exit 0
          fi
          # The donor's reconciliation may have refused after its independently
          # successful collection. Bind the archive to that attempt's upload.
          if ! upload_window="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN/attempts/$resume_attempt/jobs?per_page=100" \
            | jq -er '
              [.jobs[] | select(.name == "collect" and .conclusion == "success"
                and any(.steps[]; .name == "Collect and verify complete historical attribution" and .conclusion == "success"))
                | .steps[] | select(.name == "Retain public source evidence and collection dispositions" and .conclusion == "success")]
              | if length != 1 then error("Expected one completed collector upload")
                else .[0] | [.started_at, .completed_at] | @tsv end')"; then
            exit 0
          fi
          IFS=$'\t' read -r upload_start upload_end <<< "$upload_window"
          temp="$(mktemp -d "$RUNNER_TEMP/completed-campaign.XXXXXX")"
          trap 'rm -rf "$temp"' EXIT
          config=(bun.lock bunfig.toml package.json tsconfig.json)
          if ! git diff --quiet "$RESUME_SHA" "$GITHUB_SHA" -- "${config[@]}"; then
            exit 0
          fi
          # Resolve the commands that actually produce the archive in both
          # trees. The current preview validator independently checks it below.
          # A file present only on the donor can shadow an unchanged import.
          build_input_list() (
            cd "$1" || exit 1
            bun --no-env-file build --target=bun --packages=external --outdir="$temp/$2-build" --metafile="$temp/$2.json" \
              scripts/collect-implementation-corrections.ts scripts/install-value-merge-git.ts \
              scripts/sync-project-registry.mjs >/dev/null \
              && jq -er '.inputs | keys[]' "$temp/$2.json" > "$temp/$2.txt"
          )
          mkdir "$temp/donor"
          if ! git archive "$RESUME_SHA" | tar -xf - -C "$temp/donor" \
            || ! build_input_list "$PWD" current \
            || ! build_input_list "$temp/donor" donor \
            || ! cmp -s "$temp/current.txt" "$temp/donor.txt"; then
            exit 0
          fi
          mapfile -t modules < "$temp/current.txt"
          if [[ ${#modules[@]} -eq 0 ]] \
            || ! git ls-files --error-unmatch -- "${modules[@]}" >/dev/null \
            || ! git diff --quiet "$RESUME_SHA" "$GITHUB_SHA" -- "${modules[@]}"; then
            exit 0
          fi
          # Reconciliation output declarations and the label on the same
          # upload step do not change the producer or the uploaded bytes.
          producer_recipe() {
            git show "$1:.github/workflows/points-implementation-corrections.yml" \
              | sed -n \
                -e '/^  \(CI\|BUN_VERSION\|NODE_VERSION\|VITE_SLOP_ENVIRONMENT\):/p' \
                -e '/^  collect:$/,/^      - name: Snapshot authoritative project registry$/p' \
                -e '/^      - name: Snapshot authoritative project registry$/,/^      - name:/p' \
                -e '/^      - name: Install the pinned merge evidence collector$/,/^      - name:/p' \
                -e '/^      - name: Collect and verify complete historical attribution$/,/^      - name:/p' \
                -e '/^      - name: Retain public source evidence and collection dispositions$/,/^  reconcile:$/p' \
              | sed -E '/^      - name: /d; /^        if: steps.complete-preview.outputs.reused/d; /^    outputs:$/d; /^      (artifact_id|producer_sha): /d; /^        id: retain-campaign$/d'
          }
          donor_recipe="$(producer_recipe "$RESUME_SHA")"
          current_recipe="$(producer_recipe "$GITHUB_SHA")"
          if [[ -z "$donor_recipe" || "$donor_recipe" != "$current_recipe" ]]; then
            exit 0
          fi
          if ! archive_identity="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN/artifacts?per_page=100" \
            | jq -er --arg name "implementation-campaign-$RESUME_SHA" --arg run "$RESUME_RUN" --arg sha "$RESUME_SHA" --arg from "$upload_start" --arg to "$upload_end" '
              [.artifacts[] | select(.name == $name and .expired == false
                and (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha
                and .created_at >= $from and .created_at <= $to
                and (.digest | type == "string") and (.digest | test("^sha256:[a-f0-9]{64}$")))]
              | if length != 1 then error("Expected one retained campaign")
                else .[0] | [.id, .size_in_bytes, .digest] | @tsv end')"; then
            exit 0
          fi
          IFS=$'\t' read -r artifact_id archive_size archive_digest <<< "$archive_identity"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ && "$archive_size" =~ ^[1-9][0-9]*$ ]]
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$temp/campaign.zip" \
            || ! python3 scripts/restore-implementation-preview.py "$temp/campaign.zip" "$archive_size" "${archive_digest#sha256:}" "$temp/evidence"; then
            exit 0
          fi
          if manifest_digest="$(bun --no-env-file scripts/verify-reused-implementation-preview.ts \
            "$temp/evidence" "$PROJECT" "$BEFORE" "$OCTOBER_ORIGINAL_CREDIT")" \
            && [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN" --jq '.run_attempt')" == "$resume_attempt" ]]; then
            [[ "$manifest_digest" =~ ^[a-f0-9]{64}$ ]]
            rmdir "$RUNNER_TEMP/implementation-campaign"
            mv "$temp/evidence" "$RUNNER_TEMP/implementation-campaign"
            echo "Verified completed preview inputs from collector $RESUME_RUN artifact $artifact_id at $manifest_digest"
            echo "reused=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the checkpoint for normal reconstruction
        if: inputs.resume_run != '' && steps.complete-preview.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
          RESUME_SHA: ${{ steps.resume-source.outputs.sha }}
        run: |
          set -euo pipefail
          gh run download "$RESUME_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "implementation-campaign-$RESUME_SHA" --dir "$RUNNER_TEMP/implementation-campaign"
      - name: Install the pinned merge evidence collector
        if: steps.complete-preview.outputs.reused != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev xz-utils
          bun --no-env-file scripts/install-value-merge-git.ts "$RUNNER_TEMP/value-merge-git"
          printf '%s\n' "$RUNNER_TEMP/value-merge-git/bin" >> "$GITHUB_PATH"
      - name: Collect and verify complete historical attribution
        if: steps.complete-preview.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
          MONTH: ${{ inputs.month }}
          CANDIDATE_MONTH: ${{ inputs.candidate_month }}
          BEFORE: ${{ inputs.before }}
          OCTOBER_ORIGINAL_CREDIT: ${{ inputs.october_original_credit }}
          APPLY: ${{ inputs.apply }}
          GRAPHQL_DISCUSSIONS: ${{ inputs.graphql_discussions }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = true ] && { [ -n "$MONTH" ] || [ -n "$CANDIDATE_MONTH" ]; }; then
            echo "::error::Bounded month runs collect and preview only; apply the complete resumed historical campaign."
            exit 1
          fi
          args=(--project "$PROJECT" --output "$RUNNER_TEMP/implementation-campaign")
          if [ -n "$MONTH" ]; then args+=(--month "$MONTH"); fi
          if [ -n "$CANDIDATE_MONTH" ]; then args+=(--candidate-month "$CANDIDATE_MONTH"); fi
          if [ -n "$BEFORE" ]; then args+=(--before "$BEFORE"); fi
          if [ "$GRAPHQL_DISCUSSIONS" = true ]; then args+=(--graphql-discussions true); fi
          if [ "$OCTOBER_ORIGINAL_CREDIT" = true ]; then args+=(--october-original-credit true); fi
          # Resume from retained evidence across GitHub quota windows. Exit 75
          # is an incomplete checkpoint and prevents reconciliation. Bound the
          # entire command to five hours so the job has time to upload evidence.
          timeout --signal=TERM --kill-after=10s 18000 bun --no-env-file \
            scripts/collect-implementation-corrections.ts "${args[@]}" \
            --resume-for-seconds 18000 --request-budget 50000
      - name: Retain public source evidence and collection dispositions
        id: retain-campaign
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: implementation-campaign-${{ github.sha }}
          path: ${{ runner.temp }}/implementation-campaign
          if-no-files-found: error
          retention-days: 30

  reconcile:
    needs: collect
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && needs.collect.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Share normal production publication's lock, including private eligibility
    # and the atomic import. This workflow never deploys an untested bundle.
    concurrency:
      group: slop-production
      cancel-in-progress: false
    environment:
      name: slop-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Pin live main at the start of a preview
        id: preview-source
        if: ${{ !inputs.apply }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          preview_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          [[ "$preview_sha" =~ ^[a-f0-9]{40}$ ]]
          if ! git cat-file -e "$preview_sha^{commit}"; then
            git fetch --no-tags origin "$preview_sha"
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" "$preview_sha"
          echo "sha=$preview_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Verify the preview checkout has the dispatched correction runtime
        if: ${{ !inputs.apply }}
        env:
          APPLY: ${{ inputs.apply }}
          PREVIEW_SHA: ${{ steps.preview-source.outputs.sha }}
        run: |
          set -euo pipefail
          bun --no-install --no-env-file scripts/implementation-preview-source.ts "$PREVIEW_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PREVIEW_SHA"
          git checkout --detach "$PREVIEW_SHA"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Bind this run's successful collector upload
        env:
          ARTIFACT_ID: ${{ needs.collect.outputs.artifact_id }}
          PRODUCER_SHA: ${{ needs.collect.outputs.producer_sha }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ && "$PRODUCER_SHA" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$PRODUCER_SHA" "$GITHUB_SHA"
      - name: Load this run's verified public attribution evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.collect.outputs.artifact_id }}
          digest-mismatch: error
          path: ${{ runner.temp }}/implementation-campaign
      - name: Snapshot authoritative project registry
        env:
          SLOP_API_ORIGIN: https://slop.cash
        run: bun run projects:sync
      - name: Protect financial state and reconcile the unchanged Points pools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ inputs.apply }}
          PREVIEW_SHA: ${{ steps.preview-source.outputs.sha }}
          ARTIFACT_ID: ${{ needs.collect.outputs.artifact_id }}
          PRODUCER_SHA: ${{ needs.collect.outputs.producer_sha }}
        run: |
          set -euo pipefail
          mode=preview
          if [ "$APPLY" = true ]; then mode=apply; fi
          bun --no-env-file scripts/prepare-implementation-corrections.ts \
            "$RUNNER_TEMP/implementation-campaign/manifest.json" \
            "$RUNNER_TEMP/implementation-result" "$mode"
      - name: Retain public reconciliation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: implementation-result-${{ github.sha }}
          path: ${{ runner.temp }}/implementation-result
          if-no-files-found: warn
          retention-days: 30
