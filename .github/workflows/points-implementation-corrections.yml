name: Rebalance historical implementation Points

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project ID in the current D1 registry"
        required: true
        type: string
      month:
        description: "Optional single UTC census month (YYYY-MM); blank collects the complete census"
        type: string
      candidate_month:
        description: "Optional correction month (YYYY-MM); other pools retain explicit dispositions"
        type: string
      before:
        description: "Optional canonical UTC cutoff; blank uses the collector's historical cutoff"
        type: string
      resume_run:
        description: "Optional prior run of this workflow at the current main SHA or a main ancestor"
        type: string
      graphql_discussions:
        description: "Try complete GraphQL PR discussions for newly collected sources, with REST fallback"
        type: boolean
        default: false
      october_original_credit:
        description: "Use the reviewed October 2026 replacement-PR rule"
        type: boolean
        default: false
      apply:
        description: "Record eligible corrections after complete evidence and private financial checks"
        type: boolean
        default: false
      reviewed_manifest_sha256:
        description: "Apply only: the campaign manifest SHA-256 the repository owner reviewed"
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: slop-historical-points-${{ inputs.project }}
  cancel-in-progress: false

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE: "local:rw"

jobs:
  collect:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          job: points-corrections-collect
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/slopbot --filter=@repo/points
      - name: Install the pinned merge evidence collector
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libcurl4-openssl-dev libssl-dev libexpat1-dev zlib1g-dev xz-utils
          node apps/points/dist/programs/main.js git install "$RUNNER_TEMP/value-merge-git"
          printf '%s\n' "$RUNNER_TEMP/value-merge-git/bin" >> "$GITHUB_PATH"
      - name: Restore only trusted main-history evidence
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p "$RUNNER_TEMP/implementation-campaign"
          if [ -n "$RESUME_RUN" ]; then
            [[ "$RESUME_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN" > "$RUNNER_TEMP/resume-run.json"
            if ! resume_sha="$(jq -er --arg repository "$GITHUB_REPOSITORY" '
              select(
                .repository.full_name == $repository and
                .head_repository.full_name == $repository and
                .head_branch == "main" and
                .event == "workflow_dispatch" and
                .path == ".github/workflows/points-implementation-corrections.yml" and
                ((.head_sha // "") | test("^[a-f0-9]{40}$"))
              ) | .head_sha' "$RUNNER_TEMP/resume-run.json")"; then
              echo "::error::Resume evidence does not belong to this trusted main collector."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$resume_sha" "$GITHUB_SHA"; then
              echo "::error::Resume source is not in the current main history."
              exit 1
            fi
            gh run download "$RESUME_RUN" --repo "$GITHUB_REPOSITORY" \
              --name "implementation-campaign-$resume_sha" --dir "$RUNNER_TEMP/implementation-campaign"
          fi
      - name: Collect and verify complete historical attribution
        id: collect
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT: ${{ inputs.project }}
          MONTH: ${{ inputs.month }}
          CANDIDATE_MONTH: ${{ inputs.candidate_month }}
          BEFORE: ${{ inputs.before }}
          RESUME_RUN: ${{ inputs.resume_run }}
          OCTOBER_ORIGINAL_CREDIT: ${{ inputs.october_original_credit }}
          APPLY: ${{ inputs.apply }}
          GRAPHQL_DISCUSSIONS: ${{ inputs.graphql_discussions }}
        run: |
          set -euo pipefail
          if [ "$APPLY" = true ] && { [ -n "$MONTH" ] || [ -n "$CANDIDATE_MONTH" ]; }; then
            echo "::error::Bounded month runs collect and preview only; apply the complete resumed historical campaign."
            exit 1
          fi
          args=(--project "$PROJECT" --output "$RUNNER_TEMP/implementation-campaign")
          if [ -n "$MONTH" ]; then args+=(--month "$MONTH"); fi
          if [ -n "$CANDIDATE_MONTH" ]; then args+=(--candidate-month "$CANDIDATE_MONTH"); fi
          if [ -n "$BEFORE" ]; then args+=(--before "$BEFORE"); fi
          if [ -n "$RESUME_RUN" ]; then args+=(--resume-run "$RESUME_RUN"); fi
          if [ "$GRAPHQL_DISCUSSIONS" = true ]; then args+=(--graphql-discussions true); fi
          if [ "$OCTOBER_ORIGINAL_CREDIT" = true ]; then args+=(--october-original-credit true); fi
          timeout --signal=TERM --kill-after=10s 18000 node apps/slopbot/dist/programs/main.js \
            collect-corrections "${args[@]}" --resume-for-seconds 18000 --request-budget 50000
      - name: Retain public source evidence and collection dispositions
        if: always() && steps.restore.outcome == 'success' && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: implementation-campaign-${{ github.sha }}
          path: ${{ runner.temp }}/implementation-campaign
          if-no-files-found: error
          retention-days: 30

  reconcile:
    needs: collect
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: slop-production
      cancel-in-progress: false
    environment:
      name: slop-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: points-corrections-reconcile
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/points
      - name: Load this run's verified public attribution evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: implementation-campaign-${{ github.sha }}
          path: ${{ runner.temp }}/implementation-campaign
      - name: Protect financial state and reconcile the unchanged Points pools
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ inputs.apply }}
          REVIEWED_MANIFEST_SHA256: ${{ inputs.reviewed_manifest_sha256 }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/implementation-campaign/manifest.json"
          output="$RUNNER_TEMP/implementation-result"
          if [ "$APPLY" = true ]; then
            node apps/points/dist/programs/main.js corrections apply "$manifest" "$output" apply --reviewed-sha256 "$REVIEWED_MANIFEST_SHA256"
          elif [ -n "$REVIEWED_MANIFEST_SHA256" ]; then
            node apps/points/dist/programs/main.js corrections apply "$manifest" "$output" preview --reviewed-sha256 "$REVIEWED_MANIFEST_SHA256"
          else
            node apps/points/dist/programs/main.js corrections apply "$manifest" "$output" preview
          fi
      - name: Retain public reconciliation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: implementation-result-${{ github.sha }}
          path: ${{ runner.temp }}/implementation-result
          if-no-files-found: warn
          retention-days: 30
