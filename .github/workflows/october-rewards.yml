name: Prepare reviewed Eliza October 2026 allocation
on:
  workflow_dispatch:
    inputs:
      reviewed_packet_sha256:
        description: "Owner-reviewed SHA-256 of the private October packet"
        required: true
        type: string
      apply:
        description: "Import the reviewed Eliza proposal after private validation"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: slop-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    environment: slop-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: october-rewards
          verification: "false"
          publication: "true"
      - name: Reject known production dependency vulnerabilities
        run: pnpm audit --prod
      - run: pnpm all build --filter=@repo/operations --filter=@repo/settlement
      - name: Snapshot the production registry
        run: node apps/operations/dist/programs/main.js release registry production "$RUNNER_TEMP/october-rewards"
      - name: Validate and optionally import the private Eliza October proposal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOPBOT_APP_ID: ${{ secrets.SLOPBOT_APP_ID }}
          SLOPBOT_APP_PRIVATE_KEY: ${{ secrets.SLOPBOT_APP_PRIVATE_KEY }}
          OCTOBER_REWARDS_REVIEWED_PACKET: ${{ secrets.OCTOBER_REWARDS_REVIEWED_PACKET }}
          REVIEWED_PACKET_SHA256: ${{ inputs.reviewed_packet_sha256 }}
          OCTOBER_APPLY: ${{ inputs.apply }}
        run: node apps/settlement/dist/programs/main.js october-rewards "$RUNNER_TEMP/october-rewards/registry/snapshot.json"
