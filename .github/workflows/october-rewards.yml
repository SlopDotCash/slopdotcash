name: Prepare reviewed October 2026 allocations
on:
  workflow_dispatch:
    inputs:
      reviewed_packet_sha256:
        description: "Owner-reviewed SHA-256 of the private October packet"
        required: true
        type: string
      apply:
        description: "Import the reviewed proposals after private validation"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: slop-production
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    environment: slop-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run audit:dependencies
      - name: Validate and optionally import private October proposals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOPBOT_APP_ID: ${{ secrets.SLOPBOT_APP_ID }}
          SLOPBOT_APP_PRIVATE_KEY: ${{ secrets.SLOPBOT_APP_PRIVATE_KEY }}
          OCTOBER_REWARDS_REVIEWED_PACKET: ${{ secrets.OCTOBER_REWARDS_REVIEWED_PACKET }}
          REVIEWED_PACKET_SHA256: ${{ inputs.reviewed_packet_sha256 }}
          OCTOBER_APPLY: ${{ inputs.apply }}
        run: bun --no-env-file scripts/run-october-rewards.ts
