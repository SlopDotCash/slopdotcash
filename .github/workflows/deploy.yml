name: slop.cash

# Builds the contribution site from live elizaOS/eliza data, verifies the
# canonical skill and browser surface, and publishes only trusted main
# revisions to Cloudflare Pages.

on:
  pull_request:
    branches: [develop, development, main]
  push:
    branches: [develop, development, main]
  # scheduled-release.yml dispatches this workflow on main and development
  # every six hours, so registry changes and new GitHub activity publish
  # without a commit. A schedule trigger here runs only on the default branch
  # and cannot publish production.
  workflow_dispatch:
    inputs:
      bootstrap_staging_profiles:
        description: "First staging publication only: use the reviewed profile seed after verifying no staging Pages deployment exists"
        type: boolean
        default: false

concurrency:
  # PR supersessions cancel, while trusted runs keep independent quality lanes
  # so a release awaiting approval cannot block fresh verification.
  group: slop-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  CI: "true"
  # Keep the setup action aligned with packageManager so CI and local installs
  # resolve the same lockfile format.
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: source
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare checked browser bundle
    needs: source
    env:
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      VITE_SLOP_ENVIRONMENT: ${{ (github.ref == 'refs/heads/development' || github.base_ref == 'development') && 'staging' || 'production' }}
    runs-on: ubuntu-24.04
    concurrency:
      # Let a running staging check finish; newer development pushes replace
      # only the pending revision. PR and production supersessions still cancel.
      group: slop-quality-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/development' }}
    # The public elizaOS ledger can contain several thousand accepted outcomes.
    # Leave room for complete fail-closed hydration plus four browser projects.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify quality checkout
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$RELEASE_SHA" ]; then
            echo "::error::Quality checkout $checked_out_sha does not match the event SHA $GITHUB_SHA."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Reject known production dependency vulnerabilities
        run: bun run audit:dependencies

      - name: Install pinned skill validator dependency
        run: |
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' \
            > "$RUNNER_TEMP/slop-python-requirements.txt"
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement "$RUNNER_TEMP/slop-python-requirements.txt"

      - name: Snapshot the D1 project registry for ingestion
        # Projects are applied for and approved on slop.cash; D1 is the only
        # registry and its API enforces every policy transition. The site
        # reads projects and generated skills from D1 at runtime, so a newly
        # approved project appears without this step. Every trusted run
        # snapshots it so build-time ingestion collects the active
        # repositories. Before an environment first serves the API, the sync
        # keeps the committed snapshot and says so.
        if: github.event_name != 'pull_request'
        env:
          SLOP_API_ORIGIN: ${{ env.VITE_SLOP_ENVIRONMENT == 'staging' && 'https://staging.slop.cash' || 'https://slop.cash' }}
        run: bun run projects:sync

      - name: Validate project registry and every skill
        run: |
          set -euo pipefail
          bun run verify:contracts

      - name: Generate live contribution data
        # Pull-request code is untrusted, so this step never explicitly injects
        # a repository-scoped token into it. Trusted main runs refresh the
        # ledger before producing a deployable build.
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_STAGING_PROFILES: ${{ inputs.bootstrap_staging_profiles || false }}
        run: |
          set -euo pipefail
          profile_origin="https://slop.cash"
          if [ "$VITE_SLOP_ENVIRONMENT" = "staging" ]; then
            profile_origin="https://staging.slop.cash"
          fi
          previous_profiles="$RUNNER_TEMP/slop-previous-profiles.json"
          if [ "$BOOTSTRAP_STAGING_PROFILES" = "true" ]; then
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
            test "$GITHUB_REF" = "refs/heads/development"
            test "$VITE_SLOP_ENVIRONMENT" = "staging"
            cp data/profiles/seed.json "$previous_profiles"
            echo "First staging publication: start from the reviewed profile census."
          else
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 60 --max-filesize 8388608 \
              "$profile_origin/data/profiles.json" --output "$previous_profiles"
          fi
          # Selects the versioned value scoring policy for new work. Exit 75
          # means the hosted value feed is unavailable (owner decision D2):
          # retry once, then keep the last published snapshot, which shows its
          # stale label, and let the next scheduled release retry. There is no
          # legacy fallback. Every other failure stops the release.
          feed_status=0
          for attempt in 1 2; do
            feed_status=0
            bun run leaderboard:generate || feed_status=$?
            if [ "$feed_status" -ne 75 ]; then
              break
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Hosted value feed unavailable; retrying in 60 seconds."
              sleep 60
            fi
          done
          if [ "$feed_status" -eq 75 ]; then
            echo "::warning::Hosted value feed still unavailable; keeping the last published leaderboard snapshot."
            mkdir -p public/data
            curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
              --connect-timeout 10 --max-time 60 --max-filesize 26214400 \
              "$profile_origin/data/leaderboard.json" \
              --output public/data/leaderboard.json
            test -s public/data/leaderboard.json
          elif [ "$feed_status" -ne 0 ]; then
            exit "$feed_status"
          fi
          # Preserve previously observed issue history, including records
          # no longer accessible. Both source inventories must reconcile.
          for attempt in 1 2; do
            if bun run profiles:generate --previous "$previous_profiles"; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Profile census failed twice; not publishing partial counts."
              exit 1
            fi
            echo "::warning::Profile census did not reconcile; retrying once."
          done

      - name: Load deployed public ledger for pull-request checks
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p public/data
          ledger_file="$(mktemp "$RUNNER_TEMP/slop-ledger.XXXXXX")"
          trap 'rm -f "$ledger_file"' EXIT
          curl --fail --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 60 \
            --max-filesize 26214400 \
            --output "$ledger_file" \
            https://slop.cash/data/leaderboard.json
          test -s "$ledger_file"
          bun scripts/prepare-pr-ledger.ts \
            "$ledger_file" public/data/leaderboard.json

      - name: Validate reward lifecycle
        run: bun run cycles:check

      - name: Check code
        run: bun run verify:code

      - name: Build production site
        env:
          # Trusted refreshes use the census produced above; PR builds use the captured seed.
          SLOP_PROFILES_INPUT: ${{ github.event_name == 'pull_request' && 'data/profiles/seed.json' || 'public/data/profiles.json' }}
          SLOP_POINTS_ONLINE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
          SLOP_POINTS_BOOTSTRAP: "1"
        run: bun run build

      - name: Run installer lifecycle end-to-end checks
        run: bun run test:installer:e2e

      - name: Upload Cloudflare Pages bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: slop-source-${{ needs.source.outputs.sha }}
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  browsers:
    name: Browser ${{ matrix.lane }}
    needs: [source, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: preview-1
            server: preview
            shard: 1/2
          - lane: preview-2
            server: preview
            shard: 2/2
          - lane: pages
            server: pages
            shard: 1/1
          # The shipped bundle with Pages Functions and a fresh local D1.
          - lane: registry
            server: registry
            shard: 1/1
    env:
      VITE_SLOP_ENVIRONMENT: ${{ (github.ref == 'refs/heads/development' || github.base_ref == 'development') && 'staging' || 'production' }}
      SLOP_E2E_PREBUILT: '1'
      SLOP_E2E_VIDEO: '1'
      SLOP_E2E_LANE: ${{ matrix.server }}
    steps:
      - name: Checkout exact checked source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Verify browser checkout
        env:
          RELEASE_SHA: ${{ needs.source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The fixture workspace rebuilds the site, and its build packages skills.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install pinned skill validator dependency
        run: |
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' \
            > "$RUNNER_TEMP/slop-python-requirements.txt"
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement "$RUNNER_TEMP/slop-python-requirements.txt"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: slop-source-${{ needs.source.outputs.sha }}
          path: dist
      - name: Install Playwright system dependencies
        run: |
          # The Azure mirror stalled across release and PR runners. Use Ubuntu's
          # primary archive; the runner's URI normally points to apt-mirrors.txt.
          # Keep its suites, components and signing keys unchanged.
          sudo sed -i 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu/|' \
            /etc/apt/sources.list.d/ubuntu.sources
          grep -Fx 'URIs: https://archive.ubuntu.com/ubuntu/' \
            /etc/apt/sources.list.d/ubuntu.sources
          # Run the timeout as root so it can terminate apt and its children.
          # Do not retry an interrupted package transaction on the same runner.
          # Hosted package downloads exceeded ten minutes in two release runs.
          sudo timeout --signal=TERM --kill-after=15s 20m \
            "$(command -v node)" ./node_modules/playwright/cli.js install-deps chromium firefox
      - name: Install Playwright Chromium and Firefox
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if timeout --signal=TERM --kill-after=15s 10m ./node_modules/.bin/playwright install chromium firefox; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              echo "::error::Playwright browser installation failed twice."
              exit 1
            fi
            echo "::warning::Playwright browser installation stalled or failed; retrying once."
          done

      # run-e2e.mjs verifies the exact bundle, then runs only the lane's phase.
      # Preview and Pages lanes run in the frozen-registry fixture workspace.
      - name: Run complete assigned browser coverage
        env:
          BROWSER_SHARD: ${{ matrix.shard }}
        run: node scripts/run-e2e.mjs --shard="$BROWSER_SHARD"
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: slop-browser-diagnostics-${{ github.run_id }}-${{ matrix.lane }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: Skill, data, build, and browser checks
    if: always()
    needs: [prepare, browsers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the checked bundle and every browser lane
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$BROWSER_RESULT" = success

  staging:
    name: Deploy verified development to staging
    if: >-
      needs.quality.result == 'success' &&
      github.ref == 'refs/heads/development' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [source, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    concurrency:
      group: slop-staging
      cancel-in-progress: false
    environment:
      name: slop-staging
      url: https://staging.slop.cash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: slop-source-${{ needs.source.outputs.sha }}
          path: dist
      - name: Require staging credentials
        env:
          HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLIENT: ${{ secrets.SLOP_GITHUB_CLIENT_ID != '' && secrets.SLOP_GITHUB_CLIENT_SECRET != '' }}
          HAS_KEYS: ${{ secrets.IDENTITY_STATE_KEY != '' && secrets.IDENTITY_ASSERTION_KEY != '' && secrets.TRACE_AUTH_SECRET != '' }}
        run: |
          test "$HAS_CLOUDFLARE" = true
          test "$HAS_CLIENT" = true
          test "$HAS_KEYS" = true
      - name: Publish and verify isolated staging
        env:
          SLOP_NOTIFY_RELEASE: ${{ vars.SLOP_NOTIFY_STAGING_RELEASE }}
          SLOP_NOTIFY_MAIL_PILOTS: ${{ vars.SLOP_NOTIFY_STAGING_MAIL_PILOTS }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_APP_CLIENT_ID: ${{ secrets.SLOP_GITHUB_CLIENT_ID }}
          GITHUB_APP_CLIENT_SECRET: ${{ secrets.SLOP_GITHUB_CLIENT_SECRET }}
          IDENTITY_STATE_KEY: ${{ secrets.IDENTITY_STATE_KEY }}
          IDENTITY_ASSERTION_KEY: ${{ secrets.IDENTITY_ASSERTION_KEY }}
          TRACE_AUTH_SECRET: ${{ secrets.TRACE_AUTH_SECRET }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/development
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/check-staging-order.mjs
          node scripts/dist-manifest.mjs verify-local dist
          started_at="$(node -e 'process.stdout.write(String(Date.now()))')"
          ./node_modules/.bin/wrangler d1 migrations apply slop-staging --remote --config wrangler.staging.toml
          bun scripts/prepare-payments-import.ts "$RUNNER_TEMP/payments-import.sql"
          if [ -s "$RUNNER_TEMP/payments-import.sql" ]; then
            ./node_modules/.bin/wrangler d1 execute slop-staging --remote --config wrangler.staging.toml \
              --file "$RUNNER_TEMP/payments-import.sql"
          else
            echo "No repository payment records to import."
          fi
          ./node_modules/.bin/wrangler deploy --config workers/identity/wrangler.staging.toml
          node scripts/configure-staging-secrets.mjs
          if [ "$SLOP_NOTIFY_RELEASE" = "enabled" ]; then
            bun scripts/release-notify.mjs deploy staging "$RUNNER_TEMP/slop-notify-staging-release"
          else
            test -z "$SLOP_NOTIFY_MAIL_PILOTS"
          fi
          # Pages requires the standard config filename in its working directory.
          # Keep the production config untouched and publish the verified bundle
          # with the staging config from this exact source revision.
          publish_dir="$(mktemp -d "$RUNNER_TEMP/slop-staging-pages.XXXXXX")"
          git archive "$GITHUB_SHA" | tar -x -C "$publish_dir"
          cp wrangler.staging.toml "$publish_dir/wrangler.toml"
          if [ "$SLOP_NOTIFY_RELEASE" = "enabled" ]; then
            cp "$RUNNER_TEMP/slop-notify-staging-release/pages.toml" "$publish_dir/wrangler.toml"
          fi
          cp -R dist "$publish_dir/dist"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$publish_dir/node_modules"
          (
            cd "$publish_dir"
            ./node_modules/.bin/wrangler pages deploy \
              --project-name=slop-staging \
              --branch=development \
              --commit-hash="$GITHUB_SHA" \
              --commit-dirty=false
          )
          node scripts/verify-staging-deployment.mjs "$GITHUB_SHA" "$started_at"
          node scripts/verify-staging-backend.mjs

      - name: Retain notification release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: slop-notify-staging-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/slop-notify-staging-release/profile.json
            ${{ runner.temp }}/slop-notify-staging-release/release.json
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy trusted production bundle
    if: >-
      needs.quality.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs: [source, quality]
    env:
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      # Only publication holds this lock. Neither environment requires a
      # manual reviewer: the protected main merge is the release decision.
      group: slop-production
      cancel-in-progress: false
    environment:
      # Every release, scheduled or not, publishes the tested main head and
      # needs the Workers-scoped production credentials for the identity Worker.
      name: eliza-army-production
      url: https://slop.cash
    steps:
      - name: Checkout exact deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Verify deployment checkout
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ "$checked_out_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Deployment checkout $checked_out_sha does not match the verified workflow SHA $GITHUB_SHA."
            exit 1
          fi

      - name: Verify trusted release authority
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *)
              echo "::error::$GITHUB_EVENT_NAME is not authorized to deploy slop.cash."
              exit 1
              ;;
          esac
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::$GITHUB_EVENT_NAME production releases are restricted to refs/heads/main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked release tooling
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Download verified Pages bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: slop-source-${{ needs.source.outputs.sha }}
          path: dist

      - name: Verify downloaded Pages bundle
        run: node scripts/dist-manifest.mjs verify-local dist

      - name: Require live release-input equivalence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_main="$(
            git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --refs \
              https://github.com/SlopDotCash/slopdotcash.git refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$live_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not return a valid live main SHA."
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" fetch --force --no-tags --depth=1 origin \
            "$live_main:refs/remotes/origin/slop-live-main"
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet "$GITHUB_SHA" "$live_main" -- .; then
            echo "::error::Live main changed a slop.cash release input after $GITHUB_SHA was tested."
            exit 1
          fi

      - name: Require scoped Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::The selected release environment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Require reviewed Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/eliza-computer-pages-project.json"
          status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 1048576 \
              --output "$response" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/eliza-computer"
          )"
          if [ "$status" != "200" ]; then
            echo "::error::The reviewed eliza-computer Pages project is unavailable (HTTP $status); routine release code will not create or reconfigure it."
            exit 1
          fi
          node - "$response" <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (
            value?.success !== true ||
            value?.result?.name !== "eliza-computer" ||
            value?.result?.production_branch !== "main"
          ) {
            throw new TypeError("the reviewed eliza-computer Pages project contract drifted");
          }
          NODE

      - name: Require reviewed deck Pages custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/eliza-computer-deck-domain.json"
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/eliza-computer/domains/deck.slop.cash"
          status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 65536 \
              --output "$response" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$endpoint"
          )"
          if [ "$status" != "200" ]; then
            echo "::error::The reviewed deck.slop.cash Pages domain is unavailable (HTTP $status); routine release code will not create or reconfigure it."
            exit 1
          fi
          node - "$response" <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (value?.success !== true || value?.result?.name !== "deck.slop.cash") {
            throw new TypeError("Cloudflare did not confirm the exact deck.slop.cash Pages domain");
          }
          NODE

      - name: Deploy private identity and Cloudflare Pages
        id: pages-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_USERNAME: ${{ secrets.TELEGRAM_BOT_USERNAME }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          SLOPBOT_RELEASE: ${{ vars.SLOPBOT_RELEASE }}
          SLOP_NOTIFY_RELEASE: ${{ vars.SLOP_NOTIFY_RELEASE }}
          SLOP_NOTIFY_MAIL_PILOTS: ${{ vars.SLOP_NOTIFY_MAIL_PILOTS }}
          SLOP_FEE_CONVERTER_RELEASE: ${{ vars.SLOP_FEE_CONVERTER_RELEASE }}
        # wrangler.toml owns pages_build_output_dir. A positional directory
        # bypasses that deployment contract and must not be added here.
        run: |
          set -euo pipefail
          live_main="$(
            git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --refs \
              https://github.com/SlopDotCash/slopdotcash.git refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$live_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not return a valid live main SHA before deployment."
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" fetch --force --no-tags --depth=1 origin \
            "$live_main:refs/remotes/origin/slop-live-main"
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet "$GITHUB_SHA" "$live_main" -- .; then
            echo "::error::Live main changed a slop.cash release input immediately before deployment."
            exit 1
          fi

          # Restore only absent cleanup triggers; reject nonempty provisioning drift.
          bun scripts/verify-identity-schedules.mjs --restore-missing

          identity_secrets="$RUNNER_TEMP/slop-identity-secrets.json"
          ./node_modules/.bin/wrangler secret list \
            --config workers/identity/wrangler.toml > "$identity_secrets"
          node - "$identity_secrets" <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const expected = [
            "GITHUB_APP_CLIENT_ID",
            "GITHUB_APP_CLIENT_SECRET",
            "GITHUB_INTAKE_STATUS_TOKEN",
            "IDENTITY_ASSERTION_KEY",
            "IDENTITY_STATE_KEY",
          ];
          if (!Array.isArray(value)) throw new TypeError("identity secret inventory must be an array");
          const actual = value.map((entry) => entry?.name).sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new TypeError("identity Worker secret inventory is incomplete or contains unexpected entries");
          }
          NODE

          # Optional X credentials are installed only by this protected code release.
          if [ -n "$X_CLIENT_ID" ] || [ -n "$X_CLIENT_SECRET" ]; then
            x_secrets="$RUNNER_TEMP/slop-x-secrets.json"
            node - "$x_secrets" <<'NODE'
          const { writeFileSync } = require("node:fs");
          const { X_CLIENT_ID, X_CLIENT_SECRET } = process.env;
          if (!X_CLIENT_ID || !X_CLIENT_SECRET) throw new Error("X OAuth credentials must be configured together");
          writeFileSync(process.argv[2], JSON.stringify({ X_CLIENT_ID, X_CLIENT_SECRET }), { mode: 0o600 });
          NODE
            ./node_modules/.bin/wrangler pages secret bulk "$x_secrets" --project-name eliza-computer
            rm -f "$x_secrets"
          fi

          # Optional Telegram connection bot (PRD SOC-02): all three values or none.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] || [ -n "$TELEGRAM_BOT_USERNAME" ] || [ -n "$TELEGRAM_WEBHOOK_SECRET" ]; then
            telegram_secrets="$RUNNER_TEMP/slop-telegram-secrets.json"
            node - "$telegram_secrets" <<'NODE'
          const { writeFileSync } = require("node:fs");
          const { TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_USERNAME, TELEGRAM_WEBHOOK_SECRET } = process.env;
          if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_BOT_USERNAME || !TELEGRAM_WEBHOOK_SECRET) throw new Error("Telegram bot settings must be configured together");
          writeFileSync(process.argv[2], JSON.stringify({ TELEGRAM_BOT_TOKEN, TELEGRAM_BOT_USERNAME, TELEGRAM_WEBHOOK_SECRET }), { mode: 0o600 });
          NODE
            ./node_modules/.bin/wrangler pages secret bulk "$telegram_secrets" --project-name eliza-computer
            rm -f "$telegram_secrets"
          fi

          pages_secrets="$RUNNER_TEMP/slop-pages-secrets.txt"
          ./node_modules/.bin/wrangler pages secret list \
            --project-name eliza-computer > "$pages_secrets"
          node - "$pages_secrets" <<'NODE'
          const { readFileSync } = require("node:fs");
          const contents = readFileSync(process.argv[2], "utf8");
          const expected = [
            "OPERATOR_GITHUB_IDS",
            "TRACE_AUTH_SECRET",
          ];
          const actual = [...contents.matchAll(/^\s*-\s+([A-Z][A-Z0-9_]*):\s+Value Encrypted\s*$/gmu)]
            .map((match) => match[1])
            .sort();
          const xKeys = actual.filter((name) => name === "X_CLIENT_ID" || name === "X_CLIENT_SECRET");
          if (xKeys.length === 1) throw new TypeError("X OAuth credentials must be configured together");
          const telegramKeys = actual.filter((name) => ["TELEGRAM_BOT_TOKEN", "TELEGRAM_BOT_USERNAME", "TELEGRAM_WEBHOOK_SECRET"].includes(name));
          if (telegramKeys.length !== 0 && telegramKeys.length !== 3) throw new TypeError("Telegram bot settings must be configured together");
          const required = actual.filter((name) => !xKeys.includes(name) && !telegramKeys.includes(name));
          if (JSON.stringify(required) !== JSON.stringify(expected)) {
            throw new TypeError("Pages secret inventory is incomplete or contains unexpected entries");
          }
          NODE

          ./node_modules/.bin/wrangler d1 migrations apply slop-private \
            --remote \
            --config workers/identity/wrangler.toml
          bun scripts/prepare-points-import.ts dist "$RUNNER_TEMP/points-import.sql"
          # D1's import API can time out on upload (504) or apply every
          # statement and then answer the final poll with "Not currently
          # importing anything". A failed import rolls back, and every
          # statement is idempotent and keyed by the batch digest, so retry
          # and accept a failed attempt only when the batch is recorded.
          points_digest="$(sed -n "s/^INSERT INTO points_batches(digest,[^)]*) SELECT '\([0-9a-f]\{64\}\)'.*/\1/p" "$RUNNER_TEMP/points-import.sql")"
          points_revisions="$(grep -c '^INSERT INTO points_staging(' "$RUNNER_TEMP/points-import.sql")"
          [ "${#points_digest}" -eq 64 ] || exit 1
          points_recorded() {
            ./node_modules/.bin/wrangler d1 execute slop-private \
              --remote --json --config workers/identity/wrangler.toml \
              --command "SELECT revision_count, (SELECT COUNT(*) FROM points_staging WHERE batch_id='$points_digest') AS staged FROM points_batches WHERE digest='$points_digest'" \
              > "$RUNNER_TEMP/points-batch.json" || return 1
            POINTS_CHECK="$RUNNER_TEMP/points-batch.json" POINTS_REVISIONS="$points_revisions" node <<'NODE'
          const fs = require("node:fs");
          const rows = JSON.parse(fs.readFileSync(process.env.POINTS_CHECK, "utf8"))[0]?.results ?? [];
          const expected = Number(process.env.POINTS_REVISIONS);
          if (rows.length !== 1 || rows[0].revision_count !== expected || rows[0].staged !== 0) process.exit(1);
          NODE
          }
          points_imported=false
          for points_attempt in 1 2 3; do
            if ./node_modules/.bin/wrangler d1 execute slop-private \
              --remote --config workers/identity/wrangler.toml \
              --file "$RUNNER_TEMP/points-import.sql"; then
              points_imported=true
              break
            fi
            if points_recorded; then
              echo "points batch recorded with $points_revisions revisions after import attempt $points_attempt reported an error"
              points_imported=true
              break
            fi
            sleep $((points_attempt * 30))
          done
          [ "$points_imported" = true ] || { echo "::error::Points import failed after 3 attempts."; exit 1; }
          bun scripts/prepare-payments-import.ts "$RUNNER_TEMP/payments-import.sql"
          if [ -s "$RUNNER_TEMP/payments-import.sql" ]; then
            ./node_modules/.bin/wrangler d1 execute slop-private \
              --remote --config workers/identity/wrangler.toml \
              --file "$RUNNER_TEMP/payments-import.sql"
          else
            echo "No repository payment records to import."
          fi
          node scripts/renew-private-intake.mjs || echo "::warning::Optional trace intake renewal failed; ordinary contribution remains available."
          schema_response="$RUNNER_TEMP/slop-private-schema.json"
          ./node_modules/.bin/wrangler d1 execute slop-private \
            --remote \
            --json \
            --config workers/identity/wrangler.toml \
            --command "SELECT type, name FROM sqlite_schema WHERE name IN ('identity_assertions','identity_oauth_flows','identity_rate_limits','private_audit_events','project_applications','project_applications_one_pending_project','project_applications_one_pending_repository','project_repositories','project_revisions','project_revisions_no_delete','project_revisions_no_update','projects','projects_match_revision_insert','projects_match_revision_update','projects_no_delete','run_progress_events','trace_attachment_commit_validate','trace_attachment_commits','trace_attachment_commits_no_delete','trace_attachment_commits_no_update','trace_objects','trace_read_grants','trace_runs','trace_upload_intents','trace_uploads','wallet_claims','wallet_claims_no_delete','wallet_claims_no_update','wallet_claims_one_root_per_actor','wallet_claims_one_successor') ORDER BY type, name" \
            > "$schema_response"
          node - "$schema_response" <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const expected = [
            "index:project_applications_one_pending_project",
            "index:project_applications_one_pending_repository",
            "index:wallet_claims_one_root_per_actor",
            "index:wallet_claims_one_successor",
            "table:identity_assertions",
            "table:identity_oauth_flows",
            "table:identity_rate_limits",
            "table:private_audit_events",
            "table:project_applications",
            "table:project_repositories",
            "table:project_revisions",
            "table:projects",
            "table:run_progress_events",
            "table:trace_attachment_commits",
            "table:trace_objects",
            "table:trace_read_grants",
            "table:trace_runs",
            "table:trace_upload_intents",
            "table:trace_uploads",
            "table:wallet_claims",
            "trigger:project_revisions_no_delete",
            "trigger:project_revisions_no_update",
            "trigger:projects_match_revision_insert",
            "trigger:projects_match_revision_update",
            "trigger:projects_no_delete",
            "trigger:trace_attachment_commit_validate",
            "trigger:trace_attachment_commits_no_delete",
            "trigger:trace_attachment_commits_no_update",
            "trigger:wallet_claims_no_delete",
            "trigger:wallet_claims_no_update",
          ];
          if (!Array.isArray(value) || value.length !== 1 || value[0]?.success !== true) {
            throw new TypeError("private D1 schema query failed");
          }
          const actual = (value[0].results ?? [])
            .map((entry) => `${entry?.type}:${entry?.name}`)
            .sort();
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new TypeError("private D1 schema is incomplete or unexpected");
          }
          NODE

          # Upload and promote a version without rewriting the existing custom
          # domain or cron configuration. The production token intentionally
          # has no zone-level Workers Routes permission.
          identity_upload="$RUNNER_TEMP/slop-identity-upload.log"
          ./node_modules/.bin/wrangler versions upload \
            --config workers/identity/wrangler.toml \
            --minify \
            --tag="$GITHUB_SHA" \
            --message="slop.cash release $GITHUB_SHA" 2>&1 | tee "$identity_upload"
          identity_version_id="$(node - "$identity_upload" <<'NODE'
          const { readFileSync } = require("node:fs");
          const contents = readFileSync(process.argv[2], "utf8");
          const matches = [...contents.matchAll(/^Worker Version ID:\s*([0-9a-f-]+)\s*$/gmu)];
          if (matches.length !== 1 || !/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/u.test(matches[0][1])) {
            throw new TypeError("identity upload did not return exactly one Worker version id");
          }
          process.stdout.write(matches[0][1]);
          NODE
          )"
          ./node_modules/.bin/wrangler versions deploy \
            --name slop-identity \
            --version-id="$identity_version_id" \
            --percentage=100 \
            --message="slop.cash release $GITHUB_SHA" \
            --yes

          identity_versions="$RUNNER_TEMP/slop-identity-versions.json"
          identity_deployment="$RUNNER_TEMP/slop-identity-deployment.json"
          ./node_modules/.bin/wrangler versions list \
            --name slop-identity \
            --json > "$identity_versions"
          ./node_modules/.bin/wrangler deployments status \
            --name slop-identity \
            --json > "$identity_deployment"
          node - "$identity_versions" "$identity_deployment" "$GITHUB_SHA" <<'NODE'
          const { readFileSync } = require("node:fs");
          const versions = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const deployment = JSON.parse(readFileSync(process.argv[3], "utf8"));
          const sha = process.argv[4];
          if (!Array.isArray(deployment?.versions) || deployment.versions.length !== 1) {
            throw new TypeError("identity Worker deployment must contain exactly one version");
          }
          const active = deployment.versions[0];
          if (active?.percentage !== 100 || typeof active?.version_id !== "string") {
            throw new TypeError("identity Worker deployment is not pinned 100% to one version");
          }
          const version = Array.isArray(versions)
            ? versions.find((candidate) => candidate?.id === active.version_id)
            : undefined;
          if (
            version?.annotations?.["workers/tag"] !== sha ||
            version?.annotations?.["workers/message"] !== `slop.cash release ${sha}`
          ) {
            throw new TypeError("identity Worker deployment is not bound to the tested commit");
          }
          NODE

          bun scripts/verify-identity-schedules.mjs

          identity_rate_probe_started_at="$(date +%s)"
          if ! [[ "$identity_rate_probe_started_at" =~ ^[0-9]{10}$ ]]; then
            echo "::error::Identity rate-limit probe start time is invalid."
            exit 1
          fi
          identity_response="$RUNNER_TEMP/slop-identity-start.json"
          identity_status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 65536 \
              --output "$identity_response" \
              --write-out "%{http_code}" \
              --header "Content-Type: application/json" \
              --data '{"audience":"private-trace-api"}' \
              https://identity.slop.cash/v1/oauth/start
          )"
          if [ "$identity_status" != "201" ]; then
            echo "::error::Identity start returned HTTP $identity_status; expected 201."
            exit 1
          fi
          authorization_url="$(node - "$identity_response" <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const expected = ["authorizationUrl", "expiresAt", "flowId", "pollAfterSeconds", "pollCapability"];
          if (JSON.stringify(Object.keys(value).sort()) !== JSON.stringify(expected)) {
            throw new TypeError("identity start response has an unexpected shape");
          }
          if (!/^flow_[A-Za-z0-9_-]{24}$/u.test(value.flowId)) throw new TypeError("invalid identity flow id");
          if (!/^[A-Za-z0-9_-]{43}$/u.test(value.pollCapability)) throw new TypeError("invalid poll capability");
          if (value.pollAfterSeconds !== 2 || !Number.isFinite(Date.parse(value.expiresAt))) {
            throw new TypeError("invalid identity expiry contract");
          }
          const authorization = new URL(value.authorizationUrl);
          if (authorization.origin !== "https://identity.slop.cash" || authorization.pathname !== "/v1/oauth/authorize") {
            throw new TypeError("invalid identity authorization URL");
          }
          process.stdout.write(authorization.toString());
          NODE
          )"
          authorization_headers="$RUNNER_TEMP/slop-identity-authorization.headers"
          authorization_status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 65536 \
              --output /dev/null \
              --dump-header "$authorization_headers" \
              --write-out "%{http_code}" \
              "$authorization_url"
          )"
          if [ "$authorization_status" != "302" ]; then
            echo "::error::Identity authorization returned HTTP $authorization_status; expected 302."
            exit 1
          fi
          github_client_id="$(node - "$authorization_headers" <<'NODE'
          const { readFileSync } = require("node:fs");
          const headers = readFileSync(process.argv[2], "utf8");
          const match = headers.match(/^location:\s*(\S+)\s*$/imu);
          if (!match) throw new TypeError("identity authorization omitted its redirect");
          const location = new URL(match[1]);
          if (location.origin !== "https://github.com" || location.pathname !== "/login/oauth/authorize") {
            throw new TypeError("identity authorization did not target GitHub");
          }
          if (location.searchParams.get("redirect_uri") !== "https://identity.slop.cash/v1/oauth/callback") {
            throw new TypeError("identity authorization callback drifted");
          }
          if (location.searchParams.get("code_challenge_method") !== "S256") {
            throw new TypeError("identity authorization did not require PKCE S256");
          }
          const clientId = location.searchParams.get("client_id") ?? "";
          if (clientId.length === 0 || clientId.length > 128 || !/^[A-Za-z0-9._-]+$/u.test(clientId)) {
            throw new TypeError("identity authorization omitted the GitHub App client id");
          }
          process.stdout.write(clientId);
          NODE
          )"
          printf '%s\n' "github_client_id=$github_client_id" >> "$GITHUB_OUTPUT"

          for request_number in $(seq 2 12); do
            repeated_response="$RUNNER_TEMP/slop-identity-start-$request_number.json"
            repeated_status="$(
              curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --max-filesize 65536 \
                --output "$repeated_response" \
                --write-out "%{http_code}" \
                --header "Content-Type: application/json" \
                --data '{"audience":"private-trace-api"}' \
                https://identity.slop.cash/v1/oauth/start
            )"
            if [ "$repeated_status" != "201" ]; then
              echo "::error::Identity start request $request_number returned HTTP $repeated_status; expected 201."
              exit 1
            fi
          done
          limited_response="$RUNNER_TEMP/slop-identity-rate-limited.json"
          limited_headers="$RUNNER_TEMP/slop-identity-rate-limited.headers"
          limited_status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 65536 \
              --output "$limited_response" \
              --dump-header "$limited_headers" \
              --write-out "%{http_code}" \
              --header "Content-Type: application/json" \
              --data '{"audience":"private-trace-api"}' \
              https://identity.slop.cash/v1/oauth/start
          )"
          if [ "$limited_status" != "429" ]; then
            echo "::error::Identity start request 13 returned HTTP $limited_status; expected 429."
            exit 1
          fi
          node - "$limited_response" "$limited_headers" <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const headers = readFileSync(process.argv[3], "utf8");
          if (JSON.stringify(value) !== JSON.stringify({
            error: "rate_limited",
            message: "Too many requests. Try again later.",
          })) {
            throw new TypeError("identity rate-limit response has an unexpected shape");
          }
          const retryAfter = headers.match(/^retry-after:\s*(\d+)\s*$/imu)?.[1];
          if (retryAfter === undefined || Number(retryAfter) < 1 || Number(retryAfter) > 60) {
            throw new TypeError("identity rate-limit response omitted a bounded retry-after");
          }
          NODE

          exact_rate_limit_response="$RUNNER_TEMP/slop-identity-exact-rate-limit.json"
          ./node_modules/.bin/wrangler d1 execute slop-private \
            --remote \
            --json \
            --config workers/identity/wrangler.toml \
            --command "SELECT request_count, window_started_at, expires_at FROM identity_rate_limits WHERE window_started_at >= $identity_rate_probe_started_at AND request_count = 13 ORDER BY window_started_at DESC" \
            > "$exact_rate_limit_response"
          node - "$exact_rate_limit_response" "$identity_rate_probe_started_at" <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const probeStartedAt = Number(process.argv[3]);
          if (!Array.isArray(value) || value.length !== 1 || value[0]?.success !== true) {
            throw new TypeError("identity exact rate-limit query failed");
          }
          const rows = value[0].results ?? [];
          if (rows.length !== 1) {
            throw new TypeError("identity exact rate-limit probe did not produce one authoritative bucket");
          }
          const row = rows[0];
          if (
            row?.request_count !== 13 ||
            !Number.isSafeInteger(row?.window_started_at) ||
            row.window_started_at < probeStartedAt ||
            !Number.isSafeInteger(row?.expires_at) ||
            row.expires_at <= row.window_started_at
          ) {
            throw new TypeError("identity exact rate-limit bucket has an unexpected state");
          }
          NODE

          # The selected profile is prepared from the checked-in Pages D1 contract.
          # No pilot is selected unless the protected environment opts in.
          if [ "$SLOP_NOTIFY_RELEASE" = "enabled" ]; then
            bun scripts/release-notify.mjs deploy production "$RUNNER_TEMP/slop-notify-release"
          else
            test -z "$SLOP_NOTIFY_MAIL_PILOTS"
            echo "::notice::Notification release is disabled."
          fi

          # Slopbot (workers/slopbot, protocol/slopbot-v2.md). The owner creates
          # the Worker shell, its custom domain and its secrets once, then sets
          # the SLOPBOT_RELEASE repository variable to "enabled". Releases only
          # upload and promote versions. Its D1 tables come from the shared
          # slop-private migration apply above.
          if [ "$SLOPBOT_RELEASE" = "enabled" ]; then
          test "$SLOP_NOTIFY_RELEASE" = "enabled"
          slopbot_secrets="$RUNNER_TEMP/slopbot-secrets.json"
          ./node_modules/.bin/wrangler secret list \
            --config workers/slopbot/wrangler.toml > "$slopbot_secrets"
          node - "$slopbot_secrets" <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(value)) throw new TypeError("slopbot secret inventory must be an array");
          const names = value.map((entry) => entry?.name).sort();
          const required = [
            "SLOPBOT_APP_ID",
            "SLOPBOT_APP_PRIVATE_KEY",
            "SLOPBOT_APP_USER_ID",
            "SLOPBOT_WEBHOOK_SECRET",
            "SURPLUS_API_KEY",
          ];
          const allowed = new Set([...required, "SURPLUS_BASE_URL"]);
          if (!required.every((name) => names.includes(name)) || !names.every((name) => allowed.has(name))) {
            throw new TypeError("slopbot Worker secret inventory is incomplete or contains unexpected entries");
          }
          NODE

          slopbot_upload="$RUNNER_TEMP/slopbot-upload.log"
          ./node_modules/.bin/wrangler versions upload \
            --config workers/slopbot/wrangler.toml \
            --var="SLOPBOT_PRODUCER_REVISION:$GITHUB_SHA" \
            --minify \
            --tag="$GITHUB_SHA" \
            --message="slop.cash release $GITHUB_SHA" 2>&1 | tee "$slopbot_upload"
          slopbot_version_id="$(node - "$slopbot_upload" <<'NODE'
          const { readFileSync } = require("node:fs");
          const contents = readFileSync(process.argv[2], "utf8");
          const matches = [...contents.matchAll(/^Worker Version ID:\s*([0-9a-f-]+)\s*$/gmu)];
          if (matches.length !== 1 || !/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/u.test(matches[0][1])) {
            throw new TypeError("slopbot upload did not return exactly one Worker version id");
          }
          process.stdout.write(matches[0][1]);
          NODE
          )"
          ./node_modules/.bin/wrangler versions deploy \
            --name slop-slopbot \
            --version-id="$slopbot_version_id" \
            --percentage=100 \
            --message="slop.cash release $GITHUB_SHA" \
            --yes

          # Version deployments do not apply the scheduler or queue triggers.
          ./node_modules/.bin/wrangler triggers deploy \
            --config workers/slopbot/wrangler.toml

          slopbot_versions="$RUNNER_TEMP/slopbot-versions.json"
          slopbot_deployment="$RUNNER_TEMP/slopbot-deployment.json"
          ./node_modules/.bin/wrangler versions list --name slop-slopbot --json > "$slopbot_versions"
          ./node_modules/.bin/wrangler deployments status --name slop-slopbot --json > "$slopbot_deployment"
          node - "$slopbot_versions" "$slopbot_deployment" "$GITHUB_SHA" <<'NODE'
          const { readFileSync } = require("node:fs");
          const versions = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const deployment = JSON.parse(readFileSync(process.argv[3], "utf8"));
          const sha = process.argv[4];
          const active = Array.isArray(deployment?.versions) && deployment.versions.length === 1 ? deployment.versions[0] : null;
          if (active?.percentage !== 100 || typeof active?.version_id !== "string") {
            throw new TypeError("slopbot Worker deployment is not pinned 100% to one version");
          }
          const version = Array.isArray(versions) ? versions.find((candidate) => candidate?.id === active.version_id) : undefined;
          if (version?.annotations?.["workers/tag"] !== sha) {
            throw new TypeError("slopbot Worker deployment is not bound to the tested commit");
          }
          NODE

          slopbot_health="$RUNNER_TEMP/slopbot-health.json"
          slopbot_status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 4096 \
              --output "$slopbot_health" \
              --write-out "%{http_code}" \
              https://slopbot.slop.cash/health
          )"
          if [ "$slopbot_status" != "200" ]; then
            echo "::error::Slopbot health returned HTTP $slopbot_status; expected 200."
            exit 1
          fi
          node -e 'const v=JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")); if (v.service!=="slopbot"||v.ok!==true) throw new TypeError("unexpected slopbot health body")' "$slopbot_health"
          else
            echo "::notice::Slopbot release is not enabled (SLOPBOT_RELEASE repository variable)."
          fi


          # Fee-wallet converter (workers/fee-converter, PRD MVP-07c). The owner
          # creates the Worker shell and its secrets once, then sets the
          # SLOP_FEE_CONVERTER_RELEASE repository variable to "enabled". The
          # mode, networks and caps come only from the reviewed wrangler.toml;
          # live mode is refused unless every enabled network has its key.
          # Its D1 tables come from the shared slop-private migration apply above.
          if [ "$SLOP_FEE_CONVERTER_RELEASE" = "enabled" ]; then
          converter_secrets="$RUNNER_TEMP/slop-fee-converter-secrets.json"
          ./node_modules/.bin/wrangler secret list \
            --config workers/fee-converter/wrangler.toml > "$converter_secrets"
          node - "$converter_secrets" workers/fee-converter/wrangler.toml <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(value)) throw new TypeError("fee-converter secret inventory must be an array");
          const networks = ["BASE", "ETHEREUM", "ROBINHOOD", "SOLANA"];
          const allowed = new Set([
            ...networks.map((n) => `FEE_WALLET_KEY_${n}`),
            ...networks.map((n) => `RPC_URL_${n}`),
            "JUPITER_API_KEY",
          ]);
          const names = value.map((entry) => entry?.name);
          if (names.some((name) => !allowed.has(name))) {
            throw new TypeError("fee-converter Worker secret inventory contains unexpected entries");
          }
          const toml = readFileSync(process.argv[3], "utf8");
          const read = (key) => {
            const match = new RegExp(`^${key} = "([^"]*)"$`, "mu").exec(toml);
            if (!match) throw new TypeError(`fee-converter wrangler.toml lacks ${key}`);
            return match[1];
          };
          const mode = read("FEE_CONVERTER_MODE");
          if (!["off", "dry_run", "live"].includes(mode)) throw new TypeError("invalid FEE_CONVERTER_MODE");
          const enabled = read("FEE_CONVERTER_NETWORKS").split(",").map((n) => n.trim()).filter(Boolean);
          if (mode === "live" && enabled.includes("solana")) {
            // PRD TOK-07 / MVP-07c: Solana stays blocked until the PAY-05 fee-recipient role is kept apart from the hot key.
            throw new TypeError("live fee conversion on Solana is blocked by MVP-07c");
          }
          if (mode === "live") {
            const missing = enabled.filter((n) => !names.includes(`FEE_WALLET_KEY_${n.toUpperCase()}`));
            if (missing.length > 0) throw new TypeError(`live fee conversion lacks keys for: ${missing.join(", ")}`);
          }
          console.log(`fee-converter mode ${mode}; networks ${enabled.join(",") || "none"}`);
          NODE

          converter_upload="$RUNNER_TEMP/slop-fee-converter-upload.log"
          ./node_modules/.bin/wrangler versions upload \
            --config workers/fee-converter/wrangler.toml \
            --tag="$GITHUB_SHA" \
            --message="slop.cash release $GITHUB_SHA" 2>&1 | tee "$converter_upload"
          converter_version_id="$(node - "$converter_upload" <<'NODE'
          const { readFileSync } = require("node:fs");
          const contents = readFileSync(process.argv[2], "utf8");
          const matches = [...contents.matchAll(/^Worker Version ID:\s*([0-9a-f-]+)\s*$/gmu)];
          if (matches.length !== 1 || !/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/u.test(matches[0][1])) {
            throw new TypeError("fee-converter upload did not return exactly one Worker version id");
          }
          process.stdout.write(matches[0][1]);
          NODE
          )"
          ./node_modules/.bin/wrangler versions deploy \
            --name slop-fee-converter \
            --version-id="$converter_version_id" \
            --percentage=100 \
            --message="slop.cash release $GITHUB_SHA" \
            --yes
          # Version deploys do not change cron triggers; apply the reviewed schedule.
          ./node_modules/.bin/wrangler triggers deploy \
            --config workers/fee-converter/wrangler.toml

          converter_versions="$RUNNER_TEMP/slop-fee-converter-versions.json"
          converter_deployment="$RUNNER_TEMP/slop-fee-converter-deployment.json"
          ./node_modules/.bin/wrangler versions list --name slop-fee-converter --json > "$converter_versions"
          ./node_modules/.bin/wrangler deployments status --name slop-fee-converter --json > "$converter_deployment"
          node - "$converter_versions" "$converter_deployment" "$GITHUB_SHA" <<'NODE'
          const { readFileSync } = require("node:fs");
          const versions = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const deployment = JSON.parse(readFileSync(process.argv[3], "utf8"));
          const sha = process.argv[4];
          const active = Array.isArray(deployment?.versions) && deployment.versions.length === 1 ? deployment.versions[0] : null;
          if (active?.percentage !== 100 || typeof active?.version_id !== "string") {
            throw new TypeError("fee-converter Worker deployment is not pinned 100% to one version");
          }
          const version = Array.isArray(versions) ? versions.find((candidate) => candidate?.id === active.version_id) : undefined;
          if (version?.annotations?.["workers/tag"] !== sha) {
            throw new TypeError("fee-converter Worker deployment is not bound to the tested commit");
          }
          NODE
          else
            echo "::notice::Fee-converter Worker release is not enabled (SLOP_FEE_CONVERTER_RELEASE repository variable)."
          fi

          live_main="$(
            git -C "$GITHUB_WORKSPACE" ls-remote --exit-code --refs \
              https://github.com/SlopDotCash/slopdotcash.git refs/heads/main |
              awk 'NR == 1 { print $1 }'
          )"
          if ! [[ "$live_main" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not return a valid live main SHA immediately before the Pages deployment."
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" fetch --force --no-tags --depth=1 origin \
            "$live_main:refs/remotes/origin/slop-live-main"
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet "$GITHUB_SHA" "$live_main" -- .; then
            echo "::error::Live main changed a slop.cash release input immediately before the Pages deployment."
            exit 1
          fi

          printf '%s\n' "started_at=$(node -e 'process.stdout.write(Date.now().toString())')" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3; do
            if ./node_modules/.bin/wrangler pages deploy \
              --project-name=eliza-computer \
              --branch=main \
              --commit-hash="$RELEASE_SHA" \
              --commit-dirty=false; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::Cloudflare Pages deploy failed after ${attempt} attempts."
              exit 1
            fi
            echo "::warning::Cloudflare Pages deploy attempt ${attempt} failed; retrying."
            sleep $((attempt * 10))
          done

      - name: Retain notification release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: slop-notify-production-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/slop-notify-release/profile.json
            ${{ runner.temp }}/slop-notify-release/release.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify Cloudflare deployment commit metadata
        id: deployment-metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_NOT_BEFORE: ${{ steps.pages-deploy.outputs.started_at }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/eliza-computer-production-deployments.json"
          for attempt in $(seq 1 18); do
            status="$(
              curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --max-filesize 1048576 \
                --output "$response" \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                --header "Cache-Control: no-cache" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/eliza-computer/deployments?env=production&per_page=25"
            )"
            if [ "$status" = "200" ]; then
              if deployment="$(
                node scripts/select-pages-deployment.mjs \
                  "$response" "$RELEASE_SHA" "$DEPLOYMENT_NOT_BEFORE"
              )"; then
                IFS=$'\t' read -r deployment_id deployment_url deployment_created_on <<< "$deployment"
                printf '%s\n' "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
                printf '%s\n' "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
                echo "::notice::Cloudflare production deployment $deployment_id for $GITHUB_SHA is successful at $deployment_url"
                {
                  echo "Cloudflare deployment: \`$deployment_id\`"
                  echo
                  echo "URL: $deployment_url"
                  echo
                  echo "Created: $deployment_created_on"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              else
                selector_status="$?"
                if [ "$selector_status" != "2" ]; then
                  echo "::error::Cloudflare deployment metadata response was malformed."
                  exit "$selector_status"
                fi
              fi
            else
              echo "::warning::Cloudflare deployment metadata lookup returned HTTP $status."
            fi
            echo "::warning::Successful production metadata for $GITHUB_SHA is not visible yet (attempt $attempt/18)."
            sleep 5
          done
          echo "::error::Cloudflare did not report a new, successful, clean production deployment for commit $GITHUB_SHA."
          exit 1

      - name: Verify deck custom domain, DNS, TLS, and deployed bytes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          domain_response="$RUNNER_TEMP/eliza-computer-deck-domain-active.json"
          domain_active=false
          for attempt in $(seq 1 120); do
            status="$(
              curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --max-filesize 65536 \
                --output "$domain_response" \
                --write-out "%{http_code}" \
                --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/eliza-computer/domains/deck.slop.cash"
            )"
            if [ "$status" = "200" ] && node - "$domain_response" <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          if (
            value?.success !== true ||
            value?.result?.name !== "deck.slop.cash" ||
            value?.result?.status !== "active"
          ) process.exit(1);
          NODE
            then
              domain_active=true
              break
            fi
            echo "::warning::deck.slop.cash is not active yet (attempt $attempt/120)."
            sleep 5
          done
          if [ "$domain_active" != true ]; then
            echo "::error::Cloudflare did not activate deck.slop.cash."
            exit 1
          fi

          node -e 'require("node:dns").promises.lookup("deck.slop.cash", { all: true }).then((addresses) => { if (!Array.isArray(addresses) || addresses.length === 0) throw new TypeError("deck.slop.cash DNS returned no addresses"); })'
          received="$RUNNER_TEMP/deck-slop-cash-index.html"
          headers="$RUNNER_TEMP/deck-slop-cash.headers"
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error \
              --tlsv1.3 \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize "$(wc -c < dist/index.html)" \
              --header "Cache-Control: no-cache" \
              --dump-header "$headers" \
              "https://deck.slop.cash/?verify=$GITHUB_SHA-$GITHUB_RUN_ATTEMPT-$attempt" \
              --output "$received" &&
              cmp --silent dist/index.html "$received"; then
              node - "$headers" <<'NODE'
          const { readFileSync } = require("node:fs");
          const headers = readFileSync(process.argv[2], "utf8").toLowerCase();
          for (const name of ["content-security-policy:", "strict-transport-security:", "x-content-type-options:"]) {
            if (!headers.includes(name)) throw new TypeError(`deck.slop.cash omitted ${name}`);
          }
          NODE
              exit 0
            fi
            echo "::warning::deck.slop.cash did not match the verified build yet (attempt $attempt/120)."
            sleep 5
          done
          echo "::error::deck.slop.cash did not serve the verified build over authorized TLS."
          exit 1

      - name: Verify published skill and leaderboard
        run: |
          set -euo pipefail
          verify_download() {
            local remote_path="$1"
            local expected="$2"
            local artifact="$3"
            local received
            local expected_bytes
            local attempt=1
            received="$RUNNER_TEMP/slop-${artifact//\//-}"
            expected_bytes="$(wc -c < "$expected")"
            while [ "$attempt" -le 3 ]; do
              if curl --fail --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --max-filesize "$expected_bytes" \
                --header "Cache-Control: no-cache" \
                --header "Pragma: no-cache" \
                "https://slop.cash${remote_path}?verify=$GITHUB_SHA-$GITHUB_RUN_ATTEMPT-$attempt" \
                --output "$received" &&
                cmp --silent "$expected" "$received"; then
                return 0
              fi
              echo "::warning::$artifact verification attempt $attempt did not match the verified build."
              attempt=$((attempt + 1))
              sleep 5
            done
            echo "::error::Published $artifact did not match the verified build."
            return 1
          }
          manifest_verified=false
          # Custom-domain propagation has exceeded two minutes in production.
          # Keep retrying the exact byte inventory rather than accepting stale content.
          for manifest_attempt in $(seq 1 72); do
            if node scripts/dist-manifest.mjs verify \
              dist \
              https://slop.cash \
              "$GITHUB_SHA-$GITHUB_RUN_ATTEMPT-$manifest_attempt"; then
              manifest_verified=true
              break
            fi
            echo "::warning::Deployment manifest verification attempt $manifest_attempt did not match the verified build."
            sleep 5
          done
          if [ "$manifest_verified" != true ]; then
            echo "::error::Published deployment manifest did not match the verified build."
            exit 1
          fi
          # The inventory checks /index.html; this additional request proves the
          # public root route resolves to those same tested bytes.
          verify_download / dist/index.html index.html

      - name: Verify active private trace API boundary
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/slop-active-private-api-response.json"
          headers="$RUNNER_TEMP/slop-active-private-api-response.headers"
          for attempt in $(seq 1 18); do
            status="$(
              curl --silent --show-error \
                --connect-timeout 10 \
                --max-time 30 \
                --max-filesize 65536 \
                --output "$response" \
                --dump-header "$headers" \
                --write-out "%{http_code}" \
                --header "Cache-Control: no-cache" \
                --header "Content-Type: application/json" \
                --data '{}' \
                "https://api.slop.cash/api/v1/runs?verify=$GITHUB_SHA-$GITHUB_RUN_ATTEMPT-active-$attempt"
            )"
            if [ "$status" = "401" ] && node - "$response" "$headers" <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const headers = readFileSync(process.argv[3], "utf8");
          const contract = headers.match(/^x-slop-trace-api-contract:\s*([^\r\n]+)$/imu)?.[1]?.trim();
          if (
            value?.error !== "unauthorized" ||
            contract !== "private-trace-v1-opaque-hmac-v1"
          ) process.exit(1);
          NODE
            then
              exit 0
            fi
            echo "::warning::Active private trace boundary returned HTTP $status (attempt $attempt/18)."
            sleep 5
          done
          echo "::error::Active private trace API did not reach its fail-closed unauthenticated boundary."
          exit 1

      - name: Report optional intake health
        run: |
          status="$(curl --silent --show-error --max-time 30 --max-filesize 65536 --output /dev/null --write-out '%{http_code}' https://api.slop.cash/api/v1/private-request-intake)"
          if [ "$status" != "200" ]; then
            echo "::warning::Optional trace intake unavailable (HTTP $status); GitHub contribution remains open. Check the independent health renewal workflow."
          fi

      - name: Require public identity OAuth app
        env:
          GITHUB_CLIENT_ID: ${{ steps.pages-deploy.outputs.github_client_id }}
        run: |
          set -euo pipefail
          # Query without GitHub credentials. A private App is visible to this
          # repository's organization token but returns 404 to contributors.
          # Run this after Pages verification so an identity configuration
          # failure cannot suppress an unrelated, already-verified site fix.
          github_app_response="$RUNNER_TEMP/slop-identity-github-app.json"
          github_app_status="$(
            curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --max-filesize 65536 \
              --output "$github_app_response" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/apps/slop-identity
          )"
          if [ "$github_app_status" != "200" ]; then
            echo "::error::The Slop Identity GitHub App is not publicly discoverable (HTTP $github_app_status)."
            exit 1
          fi
          node - "$github_app_response" "$GITHUB_CLIENT_ID" <<'NODE'
          const { readFileSync } = require("node:fs");
          const value = JSON.parse(readFileSync(process.argv[2], "utf8"));
          const clientId = process.argv[3];
          if (
            value?.slug !== "slop-identity" ||
            value?.name !== "Slop Identity" ||
            value?.client_id !== clientId ||
            value?.owner?.login !== "elizaOS" ||
            JSON.stringify(value?.permissions) !== "{}" ||
            JSON.stringify(value?.events) !== "[]"
          ) {
            throw new TypeError("the public Slop Identity GitHub App contract drifted");
          }
          NODE
