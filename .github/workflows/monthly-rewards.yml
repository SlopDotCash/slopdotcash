name: Close monthly rewards

# Trusted develop code freezes the prior UTC month and opens an auditable PR.
# Pull-request code never executes with write credentials in this workflow.
on:
  schedule:
    - cron: "11 0 1 * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "Closed UTC month to prepare (YYYY-MM); blank means previous month"
        required: false
        type: string

concurrency:
  group: army-monthly-rewards
  cancel-in-progress: false

permissions:
  contents: write
  issues: read
  pull-requests: write

env:
  CI: "true"
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "24.15.0"

jobs:
  propose:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout trusted develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Reject known production dependency vulnerabilities
        run: bun run audit:dependencies

      - name: Validate requested cycle
        id: cycle
        env:
          REQUESTED_CYCLE: ${{ inputs.cycle }}
        run: |
          set -euo pipefail
          cycle="$REQUESTED_CYCLE"
          if [ -z "$cycle" ]; then
            cycle="$(node -e 'const now=new Date(); const prior=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-1,1)); process.stdout.write(`${prior.getUTCFullYear()}-${String(prior.getUTCMonth()+1).padStart(2,"0")}`)')"
          fi
          if ! [[ "$cycle" =~ ^[0-9]{4}-(0[1-9]|1[0-2])$ ]]; then
            echo "::error::Cycle must be YYYY-MM."
            exit 1
          fi
          printf 'cycle=%s\n' "$cycle" >> "$GITHUB_OUTPUT"

      - name: Validate registry and evaluator awards
        run: |
          bun run projects:check
          bun run evaluations:check

      - name: Generate complete live ledger
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run leaderboard:generate

      - name: Freeze source and prepare every project
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run rewards:close-month -- --cycle "${{ steps.cycle.outputs.cycle }}"

      - name: Verify immutable cycle chain
        run: bun run cycles:check

      - name: Open review PR
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE: ${{ steps.cycle.outputs.cycle }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- cycles)" ]; then
            echo "No new cycle artifacts for $CYCLE."
            exit 0
          fi
          branch="chore/rewards-${CYCLE}-${GITHUB_RUN_ID}"
          git config user.name "elizaOS rewards bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- cycles
          git commit -m "chore: prepare ${CYCLE} reward review"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base develop \
            --head "$branch" \
            --title "chore: review ${CYCLE} rewards" \
            --body "Freezes the complete ${CYCLE} UTC contribution ledger and opens the 14-day public reward review. No payment is approved or sent by this PR."
