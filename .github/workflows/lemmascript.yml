name: LemmaScript contracts

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    # The complete parser has a 60-minute command cap; leave room for the
    # other source contracts, pinned setup and evidence upload.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify proof checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Restore the verified Dafny archive
        # Caches the official archive, not the extracted tree, so the setup
        # script checks its pinned SHA-256 on every run before unpacking it.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/dafny-4.11.0.zip
          key: dafny-4.11.0-a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179
      - name: Install pinned prover
        run: bun run lemmascript:setup
      - name: Check inventory, source contracts, and proof integrity
        run: bun run lemmascript:check
      - name: Retain proof results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lemmascript-results-${{ github.run_id }}
          path: |
            evidence/lemmascript/*/result.json
            evidence/lemmascript/*/*.log
          if-no-files-found: error
          retention-days: 14
