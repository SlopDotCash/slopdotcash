name: LemmaScript contracts

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install pinned prover
        run: bun run lemmascript:setup
      - name: Check inventory, source contracts, and proof integrity
        run: bun run lemmascript:check
      - name: Retain proof results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lemmascript-results-${{ github.run_id }}
          path: |
            evidence/lemmascript/*/result.json
            evidence/lemmascript/*/*.log
          if-no-files-found: error
          retention-days: 14
