name: Referral root watch
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: slop-referral-root-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Rebuild public files and compare canonical roots
        run: bun --no-env-file scripts/check-referral-roots.ts
