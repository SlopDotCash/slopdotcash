name: Escrow accounting and recovery

on:
  pull_request:
    branches: [develop, development, main]
    paths:
      - 'contracts/**'
      - 'backend/payments/**'
      - 'backend/security/**'
      - 'workers/payments/**'
      - 'workers/security-payments/**'
      - 'workers/payment-executor/**'
      - 'workers/referral-accrual/**'
      - 'backend/referrals/**'
      - 'src/lib/payments/**'
      - 'src/lib/security-bounty.*'
      - 'src/lib/escrow-policy.*'
      - 'src/Earnings.tsx'
      - 'src/EscrowFunding.tsx'
      - 'src/ProjectProposalPage.tsx'
      - 'src/WalletRegistration.tsx'
      - 'src/VaultActions.tsx'
      - 'src/OwnerAwards.tsx'
      - 'src/OwnerCommitment.tsx'
      - 'src/lib/*vault-actions.ts'
      - 'src/lib/*commitment-actions.ts'
      - 'src/lib/use-payout-wallets.ts'
      - 'tests/e2e/*vault-actions.spec.ts'
      - 'tests/e2e/fixtures.ts'
      - 'src/lib/wallets.ts'
      - 'src/lib/wallet-registration.ts'
      - 'src/lib/funding-address.*'
      - 'src/lib/project-schema.*'
      - 'scripts/check-payout-test-funding.mjs'
      - 'scripts/*escrow*'
      - 'scripts/payment-keeper/**'
      - 'scripts/prepare-payment-deployments.ts'
      - 'scripts/check-payout-readiness.ts'
      - 'scripts/check-referral-roots.ts'
      - 'scripts/test-payout-browser.mjs'
      - 'scripts/child-environment.mjs'
      - 'scripts/prepare-e2e-fixture.mjs'
      - 'scripts/run-e2e*.mjs'
      - 'scripts/run-security-payments.mjs'
      - 'scripts/copy-working-tree.mjs'
      - 'playwright.config.ts'
      - 'migrations/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/escrow-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: escrow-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned skill validator dependency
        run: |
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' \
            > "$RUNNER_TEMP/slop-python-requirements.txt"
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement "$RUNNER_TEMP/slop-python-requirements.txt"

      - run: forge fmt --root contracts/evm --check
      - run: forge build --root contracts/evm --sizes
      - run: forge test --root contracts/evm
      - run: bun run test:contracts:evm
      - run: bun run test:payments
      - run: bun run test:referral-accrual:anvil
      - run: bunx playwright install --with-deps chromium
      - name: Load deployed public ledger for browser checks
        run: |
          set -euo pipefail
          mkdir -p public/data
          ledger_file="$(mktemp "$RUNNER_TEMP/slop-ledger.XXXXXX")"
          trap 'rm -f "$ledger_file"' EXIT
          curl --fail --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 60 \
            --max-filesize 26214400 \
            --output "$ledger_file" \
            https://slop.cash/data/leaderboard.json
          test -s "$ledger_file"
          bun scripts/prepare-pr-ledger.ts \
            "$ledger_file" public/data/leaderboard.json

      - run: bunx vite build
      - run: node scripts/test-payout-browser.mjs
      - name: Exercise wallet funding and recovery in Chromium
        env:
          SLOP_E2E_VAULT_ACTIONS: '1'
          SLOP_E2E_VIDEO: '1'
          SLOP_E2E_LANE: preview
        run: bun run test:e2e tests/e2e/vault-actions.spec.ts --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: payout-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/payout-*.png
            evidence/payout-browser*.json
            evidence/payout-browser*.log
            evidence/payout-videos/*.webm
            playwright-report
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/*.md
          retention-days: 30

  solana:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned skill validator dependency
        run: |
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' \
            > "$RUNNER_TEMP/slop-python-requirements.txt"
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement "$RUNNER_TEMP/slop-python-requirements.txt"

      - run: bash contracts/solana/scripts/bootstrap-linux.sh
      - run: bun run test:contracts:solana
      - name: Retain safe validator failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: solana-transaction-failures-${{ github.event.pull_request.head.sha || github.sha }}
          path: contracts/solana/.local/failure-evidence/*.json
          if-no-files-found: ignore
          retention-days: 30
      - run: bunx playwright install --with-deps chromium
      - name: Load deployed public ledger for browser checks
        run: |
          set -euo pipefail
          mkdir -p public/data
          ledger_file="$(mktemp "$RUNNER_TEMP/slop-ledger.XXXXXX")"
          trap 'rm -f "$ledger_file"' EXIT
          curl --fail --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 60 \
            --max-filesize 26214400 \
            --output "$ledger_file" \
            https://slop.cash/data/leaderboard.json
          test -s "$ledger_file"
          bun scripts/prepare-pr-ledger.ts \
            "$ledger_file" public/data/leaderboard.json

      - name: Exercise wallet funding and recovery against the validator
        env:
          SLOP_E2E_SOLANA_VAULT: '1'
          SLOP_E2E_VIDEO: '1'
          SLOP_E2E_LANE: preview
        run: bun run test:e2e tests/e2e/solana-vault-actions.spec.ts --workers=1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: solana-wallet-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/*.md
          retention-days: 30

# These jobs use isolated local chains and public fixture keys. They receive no
# environment secrets, create no public deployment, and do not use a paid RPC.
