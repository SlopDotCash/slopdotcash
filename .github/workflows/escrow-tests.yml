name: Escrow accounting and recovery

on:
  pull_request:
    branches: [develop, development, main]
    paths:
      - 'contracts/**'
      - 'backend/payments/**'
      - 'workers/payments/**'
      - 'workers/payment-executor/**'
      - 'src/lib/payments/**'
      - 'src/lib/escrow-policy.*'
      - 'src/Earnings.tsx'
      - 'src/EscrowFunding.tsx'
      - 'src/ProjectProposalPage.tsx'
      - 'scripts/*escrow*'
      - 'scripts/prepare-payment-deployments.ts'
      - 'scripts/test-payout-browser.mjs'
      - 'migrations/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/escrow-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: escrow-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test:contracts:base
      - run: bun run test:payments
      - run: bunx playwright install --with-deps chromium
      - run: bunx vite build
      - run: node scripts/test-payout-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: payout-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/payout-*.png
            evidence/payout-browser*.json
            evidence/payout-browser*.log
            evidence/payout-videos/*.webm
          retention-days: 30

  solana:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bash contracts/solana/scripts/bootstrap-linux.sh
      - run: bun run test:contracts:solana

# These jobs use isolated local chains and public fixture keys. They receive no
# environment secrets, create no public deployment, and do not use a paid RPC.
