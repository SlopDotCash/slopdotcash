name: Escrow accounting and recovery

on:
  pull_request:
    branches: [development, main]
    paths:
      - 'contracts/**'
      - '.github/workflows/escrow-tests.yml'
      - 'scripts/ci-scope.mjs'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SLOP_SOLANA_BUILD_IMAGE: solanafoundation/anchor@sha256:facc4ebd0738ba7ebc1eb4ef000deab6b37e7747960d3f400c73c40c5421b5de

concurrency:
  group: escrow-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      solana: ${{ steps.scope.outputs.solana }}
      evm: ${{ steps.scope.outputs.evm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        run: node scripts/ci-scope.mjs

  solana-verifiable:
    needs: scope
    if: needs.scope.outputs.solana == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.program.outputs.artifact-id }}
      build-attempt: ${{ steps.manifest.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the deployable Solana program in the pinned image
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$SLOP_SOLANA_BUILD_IMAGE"
          mkdir -p "$RUNNER_TEMP/solana-verifiable"
          docker run --rm --platform linux/amd64 "$SLOP_SOLANA_BUILD_IMAGE" \
            sh -c 'anchor --version; solana --version; cargo --version; rustc --version' \
            > "$RUNNER_TEMP/solana-verifiable/toolchain.txt"
          # Same /workdir and target directory as Anchor 0.32.1 --verifiable.
          # Calling its build command directly avoids the later host IDL step.
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/contracts/solana,target=/workdir" \
            --workdir /workdir \
            --env CARGO_TARGET_DIR=/workdir/docker-target \
            "$SLOP_SOLANA_BUILD_IMAGE" \
            cargo build-sbf --manifest-path programs/slop-escrow/Cargo.toml \
              --tools-version v1.52 -- --locked
          cp contracts/solana/docker-target/deploy/slop_escrow.so \
            "$RUNNER_TEMP/solana-verifiable/slop_escrow.so"
      - name: Bind the program artifact to its source and build
        id: manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          output = Path(os.environ["RUNNER_TEMP"]) / "solana-verifiable"
          program = (output / "slop_escrow.so").read_bytes()
          if not program.startswith(b"\x7fELF"):
              raise SystemExit("The program build did not produce an ELF artifact")
          digest = hashlib.sha256(program).hexdigest()
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(
              ["git", "rev-parse", "HEAD:contracts/solana"], text=True
          ).strip()
          manifest = {
              "schemaVersion": 1,
              "sourceCommit": commit,
              "solanaSourceTree": tree,
              "buildImage": os.environ["SLOP_SOLANA_BUILD_IMAGE"],
              "platform": "linux/amd64",
              "platformTools": "v1.52",
              "command": "cargo build-sbf --manifest-path programs/slop-escrow/Cargo.toml --tools-version v1.52 -- --locked",
              "toolchain": (output / "toolchain.txt").read_text().splitlines(),
              "file": "slop_escrow.so",
              "sha256": digest,
              "sizeBytes": len(program),
              "workflowRun": os.environ["GITHUB_RUN_ID"],
              "workflowAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          (output / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (output / "SHA256SUMS").write_text(f"{digest}  slop_escrow.so\n")
          print(json.dumps(manifest, indent=2))
          PY
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: program
        with:
          name: solana-verifiable-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/solana-verifiable/
          if-no-files-found: error
          retention-days: 30

  evm:
    needs: scope
    if: needs.scope.outputs.evm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      # CI check cache only (owner decision, 29 October 2026, #1467 3.10(d)).
      # Jobs that build the release bundle, deploy or hold secrets never use it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned skill validator dependency
        run: |
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' \
            > "$RUNNER_TEMP/slop-python-requirements.txt"
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement "$RUNNER_TEMP/slop-python-requirements.txt"

      - run: forge fmt --root contracts/evm --check
      - run: forge build --root contracts/evm --sizes
      - run: forge test --root contracts/evm
      - run: bun run test:contracts:evm
        if: github.event_name != 'pull_request'
      - name: Prove native keeper durability across an abrupt process crash
        if: github.event_name != 'pull_request'
        env:
          SLOP_KEEPER_RUNTIME: cloudflare
        run: bun scripts/payment-keeper/evm.integration.ts
      - run: bun run test:payments
        if: github.event_name != 'pull_request'
      - run: bun run test:referral-accrual:anvil
        if: github.event_name != 'pull_request'
      - name: Exercise fee conversion and claim recovery on an isolated local chain
        if: github.event_name != 'pull_request'
        env:
          SLOP_TEST_CLAIM_FAULTS: before,lease,finalized-role
        run: bun run test:fee-converter:fork --local
      - run: bunx playwright install --with-deps chromium
        if: github.event_name != 'pull_request'
      - name: Load deployed public ledger for browser checks
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p public/data
          ledger_file="$(mktemp "$RUNNER_TEMP/slop-ledger.XXXXXX")"
          trap 'rm -f "$ledger_file"' EXIT
          curl --fail --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --compressed \
            --retry 2 --retry-delay 2 --retry-max-time 600 \
            --max-time 180 \
            --max-filesize 26214400 \
            --output "$ledger_file" \
            https://slop.cash/data/leaderboard.json
          test -s "$ledger_file"
          bun scripts/prepare-pr-ledger.ts \
            "$ledger_file" public/data/leaderboard.json

      - run: bunx vite build
        if: github.event_name != 'pull_request'
      - run: node scripts/test-payout-browser.mjs
        if: github.event_name != 'pull_request'
      - name: Exercise wallet funding and recovery in Chromium
        if: github.event_name != 'pull_request'
        env:
          SLOP_E2E_VAULT_ACTIONS: '1'
          SLOP_E2E_VIDEO: '1'
          SLOP_E2E_LANE: preview
        run: bun run test:e2e tests/e2e/vault-actions.spec.ts --workers=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: payout-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/payout-*.png
            evidence/payout-browser*.json
            evidence/payout-browser*.log
            evidence/payout-videos/*.webm
            playwright-report
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/*.md
          retention-days: 30

  solana:
    if: github.event_name != 'pull_request'
    needs: solana-verifiable
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.15.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      # CI check cache only (owner decision, 29 October 2026, #1467 3.10(d)).
      # Jobs that build the release bundle, deploy or hold secrets never use it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install pinned skill validator dependency
        run: |
          printf '%s\n' \
            'PyYAML==6.0.3 --hash=sha256:0f29edc409a6392443abf94b9cf89ce99889a1dd5376d94316ae5145dfedd5d6' \
            > "$RUNNER_TEMP/slop-python-requirements.txt"
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement "$RUNNER_TEMP/slop-python-requirements.txt"

      - name: Require the paired producer artifact
        env:
          ARTIFACT_ID: ${{ needs.solana-verifiable.outputs.artifact-id }}
          BUILD_ATTEMPT: ${{ needs.solana-verifiable.outputs.build-attempt }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BUILD_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.solana-verifiable.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/solana-verifiable
      - run: bash contracts/solana/scripts/bootstrap-linux.sh
      - run: bun run test:contracts:solana
        env:
          SLOP_SOLANA_TEST_ARTIFACT: ${{ runner.temp }}/solana-verifiable
          SLOP_SOLANA_ARTIFACT_ATTEMPT: ${{ needs.solana-verifiable.outputs.build-attempt }}
      - name: Verify the lifecycle-tested program matches the retained artifact
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/solana-verifiable" && sha256sum --check SHA256SUMS)
          cmp contracts/solana/target/deploy/slop_escrow.so \
            "$RUNNER_TEMP/solana-verifiable/slop_escrow.so"
      - name: Retain safe validator failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: solana-transaction-failures-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            contracts/solana/.local/failure-evidence/*.json
            contracts/solana/.local/test-program.json
          if-no-files-found: ignore
          retention-days: 30
      - run: bunx playwright install --with-deps chromium
      - name: Load deployed public ledger for browser checks
        run: |
          set -euo pipefail
          mkdir -p public/data
          ledger_file="$(mktemp "$RUNNER_TEMP/slop-ledger.XXXXXX")"
          trap 'rm -f "$ledger_file"' EXIT
          curl --fail --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --compressed \
            --retry 2 --retry-delay 2 --retry-max-time 600 \
            --max-time 180 \
            --max-filesize 26214400 \
            --output "$ledger_file" \
            https://slop.cash/data/leaderboard.json
          test -s "$ledger_file"
          bun scripts/prepare-pr-ledger.ts \
            "$ledger_file" public/data/leaderboard.json

      - name: Exercise wallet funding and recovery against the validator
        env:
          SLOP_E2E_SOLANA_VAULT: '1'
          SLOP_E2E_VIDEO: '1'
          SLOP_E2E_LANE: preview
        run: bun run test:e2e tests/e2e/solana-vault-actions.spec.ts --workers=1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: solana-wallet-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
            test-results/**/*.md
          retention-days: 30

# These jobs use isolated local chains and public fixture keys. They receive no
# environment secrets, create no public deployment, and do not use a paid RPC.
