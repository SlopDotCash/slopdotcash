name: Qualify deployed staging sandbox
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run harmless deployed probes after the exact staging release
        type: choice
        options: [plan, execute]
        default: plan
permissions:
  contents: read
jobs:
  qualification:
    if: github.ref == 'refs/heads/development'
    environment: slop-staging
    concurrency:
      group: slop-staging
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Show offline plan
        run: bun scripts/qualify-vetting-sandbox.ts
      - name: Qualify the exact private deployed runner
        if: inputs.mode == 'execute'
        env:
          VETTING_QUALIFICATION_MODE: execute
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOP_VETTING_SIGNING_JWK: ${{ secrets.SLOP_VETTING_SIGNING_JWK }}
        run: bun scripts/qualify-vetting-sandbox.ts --execute
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && inputs.mode == 'execute'
        with:
          name: sandbox-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/vetting-sandbox-qualification/result.json
          if-no-files-found: warn
          retention-days: 30
