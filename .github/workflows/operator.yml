name: Operator operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        type: choice
        options: [sandbox-qualification, inspect-slopbot-runtime, asi-november-closeout]
        default: sandbox-qualification
      mode:
        description: "Sandbox qualification: plan only by default; execute runs harmless deployed probes after the exact staging release"
        type: choice
        options: [plan, execute]
        default: plan
      slopbot_source:
        description: "Slopbot runtime readback: the exact deployed Slopbot source SHA"
        type: string
        default: ""
      asi_mode:
        description: Inspect input digests, preview the reviewed ASI proposal, or apply the approved preview
        type: choice
        options: [inspect, preview, apply]
        default: inspect
      reviewed_packet_sha256:
        description: Exact SHA-256 of the private reviewed ASI packet for preview and apply
        type: string
      preview_sha256:
        description: Exact SHA-256 returned by the reviewed ASI preview for apply
        type: string

permissions:
  contents: read

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE: "local:rw"

jobs:
  sandbox-qualification:
    name: Qualify deployed staging sandbox
    if: inputs.operation == 'sandbox-qualification' && github.ref == 'refs/heads/staging'
    environment: slop-staging
    concurrency:
      group: slop-staging
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: sandbox-qualification
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/security
      - name: Show offline plan
        run: node apps/security/dist/programs/main.js sandbox-qualification
      - name: Qualify the exact private deployed runner
        if: inputs.mode == 'execute'
        env:
          VETTING_QUALIFICATION_MODE: execute
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOP_VETTING_SIGNING_JWK: ${{ secrets.SLOP_VETTING_SIGNING_JWK }}
        run: node apps/security/dist/programs/main.js sandbox-qualification --mode execute
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && inputs.mode == 'execute'
        with:
          name: sandbox-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/vetting-sandbox-qualification/result.json
          if-no-files-found: warn
          retention-days: 30

  inspect-slopbot-runtime:
    name: Read the active Slopbot runtime
    if: inputs.operation == 'inspect-slopbot-runtime' && github.ref == 'refs/heads/main'
    environment: slop-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: inspect-slopbot-runtime
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/operations
      - name: Refuse mixed Slopbot and fee operations before credentials
        env:
          SLOP_SLOPBOT_EXPECTED_SOURCE: ${{ inputs.slopbot_source }}
          SLOP_SLOPBOT_PROBE_SOLANA_RPC: "false"
          SLOP_SLOPBOT_ROTATE_SOLANA_FROM: ""
          SLOP_SLOPBOT_ROTATE_SOLANA_SOURCE: ""
          SLOP_SLOPBOT_PRIOR_PROOF_RUN: ""
        run: node apps/operations/dist/programs/main.js inspect slopbot-runtime --validate-selection
      - name: Read fixed active Slopbot CPU metadata
        env:
          SLOP_SLOPBOT_EXPECTED_SOURCE: ${{ inputs.slopbot_source }}
          SLOP_SLOPBOT_PROBE_SOLANA_RPC: "false"
          SLOP_SLOPBOT_ROTATE_SOLANA_FROM: ""
          SLOP_SLOPBOT_ROTATE_SOLANA_SOURCE: ""
          SLOP_SLOPBOT_PRIOR_PROOF_RUN: ""
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node apps/operations/dist/programs/main.js inspect slopbot-runtime
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: slopbot-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/slopbot-runtime.json
          if-no-files-found: error
          retention-days: 30

  asi-november-closeout:
    name: Inspect, preview or apply the reviewed ASI November closeout
    if: >-
      github.repository == 'SlopDotCash/slopdotcash' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.operation == 'asi-november-closeout'
    environment: slop-production
    concurrency:
      group: slop-production
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: asi-november-closeout
          verification: "false"
          publication: "true"
      - name: Reject known production dependency vulnerabilities
        run: |
          set -euo pipefail
          pnpm audit --prod
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const lock = readFileSync("pnpm-lock.yaml", "utf8");
          const section = (name) => {
            const start = lock.indexOf(`\n${name}:\n`);
            if (start < 0) return "";
            const rest = lock.slice(start + name.length + 3);
            const end = rest.search(/\n[A-Za-z]/u);
            return end < 0 ? rest : rest.slice(0, end);
          };
          const reviewed = ["2.3.2", "4.0.7"];
          const hashes = new Map([...section("patchedDependencies").matchAll(/^  picomatch@([^:\s]+):\n    hash: ([0-9a-f]{64})$/gmu)].map((match) => [match[1], match[2]]));
          const copies = [...section("packages").matchAll(/^  '?picomatch@([^:(\s']+)[^\n]*:$/gmu)].map((match) => match[1]).sort();
          const references = [...section("snapshots").matchAll(/picomatch(?:@|: )(\d+\.\d+\.\d+)(?:\(patch_hash=([0-9a-f]{64})\))?/gu)];
          if (
            hashes.size !== reviewed.length ||
            !reviewed.every((version) => hashes.has(version)) ||
            JSON.stringify(copies) !== JSON.stringify(reviewed) ||
            references.length === 0 ||
            references.some((match) => match[2] === undefined || hashes.get(match[1]) !== match[2])
          ) {
            console.error("::error::The lockfile has unexpected Picomatch copies.");
            process.exit(1);
          }
          NODE
      - run: pnpm all build --filter=@repo/operations --filter=@repo/settlement
      - name: Snapshot the production registry for leaderboard validation
        run: node apps/operations/dist/programs/main.js release registry production "$RUNNER_TEMP/asi-closeout"
      - name: Validate and optionally import the private closeout proposal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SLOPBOT_APP_ID: ${{ secrets.SLOPBOT_APP_ID }}
          SLOPBOT_APP_PRIVATE_KEY: ${{ secrets.SLOPBOT_APP_PRIVATE_KEY }}
          ASI_CLOSEOUT_REVIEWED_PACKET: ${{ secrets.ASI_CLOSEOUT_REVIEWED_PACKET }}
          REVIEWED_PACKET_SHA256: ${{ inputs.reviewed_packet_sha256 }}
          ASI_CLOSEOUT_PREVIEW_SHA256: ${{ inputs.preview_sha256 }}
          ASI_CLOSEOUT_MODE: ${{ inputs.asi_mode }}
        run: node apps/settlement/dist/programs/main.js asi-november-closeout "$RUNNER_TEMP/asi-closeout/registry/snapshot.json"
