name: Trusted unsafe destination transition gate

on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-unsafe-destination-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unsafe-destination-transitions:
    name: Trusted unsafe destination transition gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable trusted base only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Install pinned Bun for trusted local modules only
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      # Only Git objects are read from the proposal. Never checkout its tree,
      # install its dependencies, or execute any contributor-controlled code.
      - name: Preserve accepted cycle and unsafe destination evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CYCLE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CYCLE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CYCLE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CYCLE_BASE_SHA"
          git fetch --no-tags --depth=1 origin \
            "+refs/pull/$CYCLE_PR_NUMBER/head:refs/remotes/origin/slop-cycle-head"
          test "$(git rev-parse refs/remotes/origin/slop-cycle-head)" = "$CYCLE_HEAD_SHA"
          bun --no-install scripts/check-unsafe-destination-transitions.ts \
            "$CYCLE_BASE_SHA" "$CYCLE_HEAD_SHA"
