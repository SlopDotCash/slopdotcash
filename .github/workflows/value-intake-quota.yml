name: Inspect historical value intake GitHub quota
on:
  workflow_dispatch:
    inputs:
      project:
        description: Registered project ID
        required: true
        type: string
      manifest_sha256:
        description: Expected immutable project manifest SHA-256
        required: true
        type: string
      plan_sha256:
        description: SHA-256 of the local reviewed singleton plan
        required: true
        type: string
      commit_witness:
        description: Optional reviewed commit-files read with the quota token
        type: choice
        default: 'none'
        options:
          - 'none'
          - 'slop360'
          - 'slop367'
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    environment: slop-production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Read the registered repository's quota with the existing App
        env:
          SLOP_QUOTA_PROJECT: ${{ inputs.project }}
          SLOP_QUOTA_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          SLOP_QUOTA_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          SLOP_QUOTA_COMMIT_WITNESS: ${{ inputs.commit_witness }}
          SLOPBOT_APP_ID: ${{ secrets.SLOPBOT_APP_ID }}
          SLOPBOT_APP_PRIVATE_KEY: ${{ secrets.SLOPBOT_APP_PRIVATE_KEY }}
        run: bun --no-env-file scripts/inspect-slopbot-app-quota.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: slopbot-app-quota-${{ github.sha }}
          path: ${{ runner.temp }}/slopbot-app-quota.json
          if-no-files-found: error
          retention-days: 7
