name: Scheduled scanner controller
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [slop.cash]
    types: [completed]
    branches: [main, development]
permissions:
  contents: read
env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  TURBO_CACHE: "local:rw"
jobs:
  dispatch:
    if: >-
      vars.VETTING_CONTROLLER_SCHEDULE == 'enabled' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == github.event.repository.id &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      actions: write
      contents: read
    steps:
      - name: Mint scan dispatch token
        id: dispatch-token
        if: vars.SCAN_DISPATCH_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.SCAN_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCAN_DISPATCH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
      - name: Dispatch protected scanner branches
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token || github.token }}
          TRIGGER_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.event.workflow_run.head_branch }}
          COMPARE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wait_budget="${SCAN_DISPATCH_WAIT_BUDGET:-3900}"
          min_wait="${SCAN_DISPATCH_MIN_WAIT:-30}"
          gh_retry() {
            local attempt=1 status out err wait reset now
            out="$(mktemp)"
            err="$(mktemp)"
            while :; do
              if "$@" >"$out" 2>"$err"; then cat "$out"; rm -f "$out" "$err"; return 0; else status=$?; fi
              if [ "$attempt" -ge 6 ]; then cat "$err" >&2; rm -f "$out" "$err"; return "$status"; fi
              if grep -qiE 'rate limit|HTTP 429' "$err"; then
                reset="$(gh api rate_limit --jq .resources.core.reset 2>/dev/null || echo 0)"
                now="$(date +%s)"
                wait=$((reset - now + 5))
                [ "$wait" -lt "$min_wait" ] && wait="$min_wait"
              elif grep -qE 'HTTP 50[0-9]' "$err"; then
                wait=$((attempt * min_wait))
              else
                cat "$err" >&2; rm -f "$out" "$err"; return "$status"
              fi
              if [ "$wait" -gt "$wait_budget" ]; then cat "$err" >&2; rm -f "$out" "$err"; return "$status"; fi
              wait_budget=$((wait_budget - wait))
              echo "GitHub refused a request ($(head -c 200 "$err" | tr '\n' ' ')); retrying in ${wait}s." >&2
              sleep "$wait"
              attempt=$((attempt + 1))
            done
          }
          refs="main development"
          if [ "$TRIGGER_EVENT" = workflow_run ]; then
            case "$RELEASE_REF" in main|development) refs="$RELEASE_REF" ;; *) exit 1 ;; esac
          fi
          for ref in $refs; do
            head="$(gh_retry gh api "repos/$GITHUB_REPOSITORY/commits/heads/$ref" --jq .sha)"
            # The site serves the scanner input list of the commit its release
            # deployed. A scan runs on that commit, or on a later commit of the
            # branch that changed no listed input and no path in a scanner
            # directory; the controller checks the same rule against its own
            # checkout (PRD section 8, operator decision of 23 November 2026).
            case "$ref" in
              main) site="https://slop.cash" ;;
              development) site="https://staging.slop.cash" ;;
            esac
            inputs="$(mktemp)"
            if ! curl -fsS --max-time 30 "$site/scanner-inputs.json" -o "$inputs" \
              || ! jq -e '.schemaVersion == "1" and (.commit | type == "string" and test("^[0-9a-f]{40}$")) and (.files | type == "array" and length > 0 and all(type == "string")) and (.directories | type == "array" and all(type == "string")) and (.excluded | type == "array" and all(type == "string"))' "$inputs" >/dev/null; then
              echo "::notice title=Scanner waits for release::$ref serves no readable scanner input list, so no scan is dispatched."
              rm -f "$inputs"
              continue
            fi
            live="$(jq -r .commit "$inputs")"
            if [ "$live" != "$head" ]; then
              changed="$(GH_TOKEN="$COMPARE_TOKEN" gh_retry gh api "repos/$GITHUB_REPOSITORY/compare/$live...$head" | jq --slurpfile list "$inputs" 'if .status == "ahead" and (.files | length) < 300 then [.files[] | .filename, (.previous_filename // empty)] | map(select(. as $path | ($list[0].files | index($path)) != null or (($list[0].directories | any(. as $dir | $path | startswith($dir))) and ($list[0].excluded | any(. as $dir | $path | startswith($dir)) | not) and ($path | test("([.]test[.]([cm]?[jt]sx?|vibe)|[.]md|(^|/)test/.*)$") | not)))) | length else "out-of-order" end' || echo unreadable)"
              if [ "$changed" != 0 ]; then
                echo "::notice title=Scanner waits for release::$ref serves $live; up to $head a scanner input changed or the commits are not in order ($changed), so its release must deploy before scanning."
                rm -f "$inputs"
                continue
              fi
            fi
            rm -f "$inputs"
            active="$(gh_retry gh run list --repo "$GITHUB_REPOSITORY" --workflow vetting-controller.yml --branch "$ref" --event workflow_dispatch --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [ "$active" -eq 0 ]; then
              gh_retry gh workflow run vetting-controller.yml --repo "$GITHUB_REPOSITORY" --ref "$ref"
            fi
          done
  scan:
    if: github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'slop-production' || 'slop-staging' }}
    concurrency:
      group: slop-vetting-controller-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Require scanner activation
        env:
          ENABLED: ${{ vars.VETTING_CONTROLLER_RELEASE }}
        run: test "$ENABLED" = enabled
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          job: scan
          verification: "false"
          publication: "true"
      - run: pnpm all build --filter=@repo/security
      - name: Mint scanner read token
        id: scan-token
        if: vars.SCAN_DISPATCH_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.SCAN_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCAN_DISPATCH_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-metadata: read
      - name: Choose scanner read token
        id: read-token
        env:
          APP_TOKEN: ${{ steps.scan-token.outputs.token }}
          SHARED_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shared="$(curl -fsS -H "Authorization: Bearer $SHARED_TOKEN" https://api.github.com/rate_limit | jq -r '.resources.core | "\(.remaining) of \(.limit)"' || echo unknown)"
          echo "Shared GITHUB_TOKEN core requests left: $shared"
          source=shared
          if [ -n "$APP_TOKEN" ]; then
            status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $APP_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/octocat/Hello-World || echo 000)"
            if [ "$status" = 200 ]; then
              source=app
            else
              echo "::warning title=Scanner read token::The scan App token read a public repository with HTTP $status; using GITHUB_TOKEN."
            fi
          fi
          echo "Scanner GitHub reads use the $source token."
          echo "source=$source" >> "$GITHUB_OUTPUT"
      - name: Run bounded scanner and retain publication state
        env:
          GITHUB_TOKEN: ${{ steps.read-token.outputs.source == 'app' && steps.scan-token.outputs.token || github.token }}
          GITHUB_COMPARE_TOKEN: ${{ github.token }}
          SURPLUS_API_KEY: ${{ secrets.SURPLUS_API_KEY }}
          SLOP_VETTING_SIGNING_JWK: ${{ secrets.SLOP_VETTING_SIGNING_JWK }}
          VETTING_RATE_CARDS: ${{ vars.VETTING_RATE_CARDS }}
        run: node apps/security/dist/programs/main.js scan
