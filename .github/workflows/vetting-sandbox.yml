name: Isolated artifact workflow
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vetting-sandbox-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  isolated-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Exercise signed requests, real disposable containers and the scan controller
        env:
          CI: "true"
          SLOP_SANDBOX_TEST_URL: http://127.0.0.1:8896
        run: |
          set -euo pipefail
          # The locally built image ID and checkout identify this CI runner.
          # They do not prove a deployed Cloudflare image.
          image="$(docker build --quiet --tag slop-native-merge-base workers/vetting-sandbox)"
          export RUNNER_IMAGE_SHA256="${image#sha256:}"
          # The original image's Git 2.34 lacks merge-tree --write-tree. Build
          # only this proof's derivative; production/controller still use image.
          merge_image="$(docker build --quiet --file tests/fixtures/value-merge.Dockerfile tests/fixtures)"
          transport_pid=""
          runner_pid=""
          transport_bundle="$RUNNER_TEMP/value-merge-transport-public.bundle"
          cleanup() {
            if [ -n "$transport_pid" ]; then kill "$transport_pid" 2>/dev/null || true; wait "$transport_pid" 2>/dev/null || true; fi
            if [ -n "$runner_pid" ]; then kill "$runner_pid" 2>/dev/null || true; wait "$runner_pid" 2>/dev/null || true; fi
            rm -f "$transport_bundle"
          }
          trap cleanup EXIT
          bun --no-env-file scripts/value-merge-resolution.integration.ts "$merge_image" "$RUNNER_TEMP/value-merge-proof.json" "$image" "$transport_bundle"
          # A harmless JSON size control exercises the proposed multipart/RPC
          # transport with the real SDK. No unpublished assessment is uploaded.
          ./node_modules/.bin/wrangler dev --config tests/fixtures/value-merge-transport-pages.toml \
            --config tests/fixtures/value-merge-transport-publisher.toml --ip 127.0.0.1 --port 8897 \
            > "$RUNNER_TEMP/merge-transport.log" 2>&1 &
          transport_pid=$!
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8897/health > /dev/null; then break; fi
            if ! kill -0 "$transport_pid" 2>/dev/null; then echo 'Test transport Worker stopped'; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8897/health > /dev/null
          node scripts/value-merge-transport.workflow.mjs "$transport_bundle" --transport-control \
            "$RUNNER_TEMP/value-merge-transport.json" http://127.0.0.1:8897 "$transport_pid"
          kill "$transport_pid"
          wait "$transport_pid" || true
          transport_pid=""
          ./node_modules/.bin/wrangler dev --config workers/vetting-sandbox/wrangler.toml --ip 127.0.0.1 --port 8896 \
            --var "RUNNER_IMAGE_SHA256:$RUNNER_IMAGE_SHA256" --var "SLOP_RELEASE_SHA:$GITHUB_SHA" > "$RUNNER_TEMP/sandbox.log" 2>&1 &
          runner_pid=$!
          for attempt in $(seq 1 120); do
            if curl --fail --silent "$SLOP_SANDBOX_TEST_URL/health" > /dev/null; then break; fi
            if ! kill -0 "$runner_pid" 2>/dev/null; then cat "$RUNNER_TEMP/sandbox.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent "$SLOP_SANDBOX_TEST_URL/health"
          bun run test:vetting:sandbox
          bun test ./scripts/vetting-scan-service.test.ts --test-name-pattern "native artifact runs only in the real disposable sandbox"
      - name: Retain bounded native merge proof metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-merge-proof-${{ github.sha }}
          path: |
            ${{ runner.temp }}/value-merge-proof.json
            ${{ runner.temp }}/value-merge-transport.json
          if-no-files-found: warn
          retention-days: 7
