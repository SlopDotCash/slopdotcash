name: Isolated artifact workflow
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vetting-sandbox-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  isolated-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      # CI check cache only (owner decision, 29 October 2026, #1467 3.10(d)).
      # Jobs that build the release bundle, deploy or hold secrets never use it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Exercise signed requests, real disposable containers and the scan controller
        env:
          CI: "true"
          SLOP_SANDBOX_TEST_URL: http://127.0.0.1:8896
        run: |
          set -euo pipefail
          bun --no-env-file scripts/prepare-vetting-sandbox.mjs
          # The locally built image ID and checkout identify this CI runner.
          # They do not prove a deployed Cloudflare image.
          image="$(docker build --quiet workers/vetting-sandbox)"
          export RUNNER_IMAGE_SHA256="${image#sha256:}"
          runner_pid=""
          merge_pid=""
          cleanup() {
            if [ -n "$merge_pid" ]; then kill "$merge_pid" 2>/dev/null || true; wait "$merge_pid" 2>/dev/null || true; fi
            if [ -n "$runner_pid" ]; then kill "$runner_pid" 2>/dev/null || true; wait "$runner_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          # Same deployed-source operation/image, local SDK only. The input is
          # public Git metadata and objects, never a subscription assessment.
          ./node_modules/.bin/wrangler dev --config tests/fixtures/value-merge-sdk-pages.toml \
            --config tests/fixtures/value-merge-sdk-publisher.toml \
            --config workers/vetting-sandbox/wrangler.toml --ip 127.0.0.1 --port 8897 \
            > "$RUNNER_TEMP/merge-sdk.log" 2>&1 &
          merge_pid=$!
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8897/health > /dev/null; then break; fi
            if ! kill -0 "$merge_pid" 2>/dev/null; then echo 'Merge qualification Worker stopped'; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8897/health > /dev/null
          node scripts/value-merge-sdk.workflow.mjs http://127.0.0.1:8897 "$RUNNER_TEMP/value-merge-sdk.json" "$image"
          kill "$merge_pid"
          wait "$merge_pid" || true
          merge_pid=""
          ./node_modules/.bin/wrangler dev --config workers/vetting-sandbox/wrangler.toml --ip 127.0.0.1 --port 8896 \
            --var "RUNNER_IMAGE_SHA256:$RUNNER_IMAGE_SHA256" --var "SLOP_RELEASE_SHA:$GITHUB_SHA" > "$RUNNER_TEMP/sandbox.log" 2>&1 &
          runner_pid=$!
          for attempt in $(seq 1 120); do
            if curl --fail --silent "$SLOP_SANDBOX_TEST_URL/health" > /dev/null; then break; fi
            if ! kill -0 "$runner_pid" 2>/dev/null; then cat "$RUNNER_TEMP/sandbox.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent "$SLOP_SANDBOX_TEST_URL/health"
          bun run test:vetting:sandbox
          bun test ./scripts/vetting-scan-service.test.ts --test-name-pattern "native artifact runs only in the real disposable sandbox"
      - name: Retain safe fixed merge SDK results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fixed-merge-sdk-${{ github.sha }}
          path: ${{ runner.temp }}/value-merge-sdk.json
          if-no-files-found: warn
          retention-days: 7
