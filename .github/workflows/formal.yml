name: State model verification

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quint:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.15.0"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install pinned tools without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check source inventory and executable scenarios
        run: bun run formal:check
      - name: Explore finite state graphs
        run: |
          java -version
          bun run formal:verify
      - name: Retain verification commands and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quint-state-results-${{ github.run_id }}
          path: evidence/formal
          if-no-files-found: error
          retention-days: 14
