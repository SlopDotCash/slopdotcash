name: State model verification

on:
  workflow_call:
    inputs:
      models:
        # "all", "none", or space-separated model names selected by
        # scripts/ci-scope.mjs for a pull request.
        type: string
        default: all
      shards:
        type: string
        default: "[1, 2, 3, 4, 5, 6]"
  workflow_dispatch:
    inputs:
      models:
        description: "all, or space-separated model names for a focused diagnostic run"
        type: string
        default: all
      shards:
        description: "JSON shard array; use [1] for a small focused diagnostic run"
        type: string
        default: "[1, 2, 3, 4, 5, 6]"

permissions:
  contents: read

env:
  NODE_VERSION: "24.15.0"
  BUN_VERSION: "1.3.14"

# Every model runs the same per-model commands as `bun run formal:check` and
# `bun run formal:verify` (`check-formal.mjs [--verify] --model=NAME`). Shards
# only split the sorted model list; the quint job refuses the result unless
# every current model has exactly one passing check and verification report
# bound to this checkout's model, source and tool bytes.
jobs:
  inventory:
    runs-on: ubuntu-24.04
    # Retain every native counterexample/continuation control and cold setup.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the proof checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned tools without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Restore the Apalache distribution
        # The local translator checks the approved JAR digest on every use.
        id: apalache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint/apalache-dist-0.62.4
          key: apalache-0.62.4-e5223915
      - name: Download the pinned Apalache distribution with retries
        if: steps.apalache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if node -e '
              const { dirname, join } = require("node:path");
              const root = dirname(require.resolve("@informalsystems/quint/package.json"));
              const { fetchApalache } = require(join(root, "dist/src/apalache.js"));
              fetchApalache("0.62.4", 0).then((result) => {
                if (result.isLeft()) {
                  console.error(result.value);
                  process.exit(1);
                }
              });
            '; then
              exit 0
            fi
            echo "::warning::Apalache download attempt $attempt failed."
            sleep $((attempt * 10))
          done
          exit 1
      - name: Refuse false proofs with full-state and safety-view checks
        env:
          SLOP_QUINT_TRANSLATOR_TEST: "1"
        run: >-
          bun test
          ./scripts/quint-local-translator.test.ts
          ./scripts/quint-safety-view.test.ts
          ./scripts/owner-vault-terminal-quotient.test.ts
          ./scripts/project-lookup-legacy-quotient.test.ts
          ./scripts/owner-vault-delayed-input.test.ts
          ./scripts/admin-mutation-continuation-quotient.test.ts
          ./scripts/email-preference-request-quotient.test.ts
          ./scripts/publication-continuation-quotient.test.ts
          ./scripts/security-settings-safety-view.test.ts
          ./scripts/solana-binding-api-quotient.test.ts
          ./scripts/solana-wallet-provider-quotient.test.ts
          ./scripts/contributor-allocation-safety-view.test.ts
          ./scripts/bot-inference-symmetry.test.ts
          ./scripts/operator-keeper-safety-view.test.ts
          ./scripts/formal-source-binding.test.ts
          ./scripts/formal-report.test.ts
      - name: Check source inventory and state catalog
        run: |
          bun run formal:coverage
          bun run formal:states

  models:
    name: models ${{ matrix.shard }}
    # Manual diagnostics may select models; trusted releases request all.
    if: ${{ (inputs.models || 'all') != 'none' }}
    runs-on: ubuntu-24.04
    # Each model keeps its explicit bound; leave time for the complete shard.
    # The prior 75-minute budget canceled two shards before their later models.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.shards || '[1, 2, 3, 4, 5, 6]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the proof checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned tools without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Restore the Apalache distribution
        # The local translator checks the approved JAR digest on every use.
        id: apalache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.quint/apalache-dist-0.62.4
          key: apalache-0.62.4-e5223915
      - name: Download the pinned Apalache distribution with retries
        if: steps.apalache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if node -e '
              const { dirname, join } = require("node:path");
              const root = dirname(require.resolve("@informalsystems/quint/package.json"));
              const { fetchApalache } = require(join(root, "dist/src/apalache.js"));
              fetchApalache("0.62.4", 0).then((result) => {
                if (result.isLeft()) {
                  console.error(result.value);
                  process.exit(1);
                }
              });
            '; then
              exit 0
            fi
            echo "::warning::Apalache download attempt $attempt failed."
            sleep $((attempt * 10))
          done
          exit 1
      - name: Check scenarios and explore finite state graphs
        env:
          SHARD_INDEX: ${{ strategy.job-index }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          SELECTED_MODELS: ${{ inputs.models || 'all' }}
        run: |
          set -euo pipefail
          java -version
          mapfile -t models < <(node --input-type=module -e '
            import { listModels } from "./scripts/formal-models.mjs";
            const [index, total] = process.argv.slice(1).map(Number);
            if (!Number.isSafeInteger(total) || total < 1 || !(index >= 0 && index < total))
              throw new Error("Invalid model shard");
            const name = (path) => path.slice(path.lastIndexOf("/") + 1, -".qnt".length);
            const selected = process.env.SELECTED_MODELS;
            const wanted = selected === "all" ? null : new Set(selected.split(" "));
            const paths = listModels(process.cwd()).filter((path) => !wanted || wanted.has(name(path)));
            if (wanted && paths.length !== wanted.size)
              throw new Error("A selected model does not exist in this checkout");
            for (const [position, path] of paths.entries())
              if (position % total === index) console.log(name(path));
          ' "$SHARD_INDEX" "$SHARD_TOTAL")
          test "${#models[@]}" -gt 0
          echo "Shard $((SHARD_INDEX + 1))/$SHARD_TOTAL: ${#models[@]} models"
          failed=()
          for model in "${models[@]}"; do
            node scripts/check-formal.mjs "--model=$model" || failed+=("check $model")
          done
          for model in "${models[@]}"; do
            node scripts/check-formal.mjs --verify "--model=$model" || failed+=("verify $model")
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            printf '::error::Failed: %s\n' "${failed[@]}"
            exit 1
          fi
      - name: Retain shard reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quint-state-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: evidence/formal
          if-no-files-found: error
          # A re-run of one failed shard replaces only that shard's reports.
          overwrite: true
          retention-days: 3

  quint:
    needs: [inventory, models]
    if: ${{ always() && !cancelled() && (inputs.models || 'all') != 'none' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the proof checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Collect shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: quint-state-shard-${{ github.run_id }}-*
          path: ${{ runner.temp }}/quint-shards
          merge-multiple: true
      - name: Require one passing check and verification for every selected model
        env:
          SHARD_REPORTS: ${{ runner.temp }}/quint-shards
          SELECTED_MODELS: ${{ inputs.models || 'all' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { existsSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { listModels, modelSources } from "./scripts/formal-models.mjs";
          import { formalAdapterOverlaySha256, formalReportProblems, formalStageArguments, formalTimeoutMs, formalToolPaths } from "./scripts/formal-report.mjs";
          import { readSafetyViews, bindSafetyView } from "./scripts/quint-safety-view.mjs";
          import { verificationTransition } from "./scripts/quint-verification-step.mjs";

          const root = process.cwd();
          const shards = process.env.SHARD_REPORTS;
          const digest = (path) =>
            createHash("sha256").update(readFileSync(join(root, path))).digest("hex");
          const safetyViews = readSafetyViews(root);
          const quintVersion = JSON.parse(readFileSync(join(root, "package.json"), "utf8")).devDependencies["@informalsystems/quint"];
          const selected = process.env.SELECTED_MODELS;
          const wanted = selected === "all" ? null : new Set(selected.split(" "));
          const models = listModels(root).filter(
            (path) => !wanted || wanted.has(path.slice(path.lastIndexOf("/") + 1, -".qnt".length)),
          );
          const problems = [];
          if (wanted && models.length !== wanted.size)
            problems.push("A selected model does not exist in this checkout");
          const merged = {};
          for (const [prefix, stages] of [["checks", 3], ["verification", 1]]) {
            const results = [];
            let base = null;
            for (const path of models) {
              const name = path.slice(path.lastIndexOf("/") + 1, -".qnt".length);
              const file = join(shards, `${prefix}-${name}.json`);
              if (!existsSync(file)) {
                problems.push(`${prefix}: no report for ${path}`);
                continue;
              }
              const report = JSON.parse(readFileSync(file, "utf8"));
              const source = readFileSync(join(root, path), "utf8");
              const sources = modelSources(source);
              const verify = prefix === "verification";
              const transition = verify ? verificationTransition(path, source) : null;
              const temporalProperties = [...source.matchAll(/^\s*temporal\s+(\w+Property)\s*=/gmu)].map((match) => match[1]);
              const view = verify ? safetyViews.views.find((entry) => entry.model === path) : null;
              let safetyView = null;
              if (view) {
                bindSafetyView(safetyViews, view.id, path, source);
                const { module, ...evidence } = view;
                safetyView = { ...evidence, adapterSha256: safetyViews.quintAdapterSha256, overlaySha256: formalAdapterOverlaySha256(safetyViews.quintAdapterSha256) };
              }
              const expected = {
                checkoutRoot: root,
                model: path,
                sha256: digest(path),
                sources: Object.fromEntries(sources.map((file) => [file, digest(file)])),
                toolHashes: Object.fromEntries(formalToolPaths(verify).map((file) => [file, digest(file)])),
                verify,
                commands: formalStageArguments(path, verify, transition, temporalProperties),
                finiteTransition: transition ?? { step: "step", kind: "concrete" },
                safetyView,
                quintVersion,
                timeoutMs: formalTimeoutMs(path, verify),
              };
              const invalid = formalReportProblems(report, expected);
              if (invalid.length) {
                problems.push(...invalid.map((reason) => `${prefix}: ${path}: ${reason}`));
                continue;
              }
              base ??= report;
              if (JSON.stringify(report.toolHashes) !== JSON.stringify(base.toolHashes) ||
                  report.javaVersion !== base.javaVersion ||
                  report.quintVersion !== base.quintVersion ||
                  report.mode !== base.mode)
                problems.push(`${prefix}: ${path} used different tools`);
              results.push(...(report.results ?? []));
            }
            if (base)
              merged[prefix] = {
                ...base,
                generatedAt: new Date().toISOString(),
                canceled: false,
                inputsUnchanged: problems.length === 0,
                results,
              };
          }
          mkdirSync(join(root, "evidence/formal"), { recursive: true });
          for (const [prefix, report] of Object.entries(merged))
            writeFileSync(
              join(root, "evidence/formal", `${prefix}.json`),
              `${JSON.stringify(report, null, 2)}\n`,
            );
          if (problems.length) {
            for (const problem of problems) console.log(`::error::${problem}`);
            process.exit(1);
          }
          console.log(
            `${merged.checks.results.length} check stages and ${merged.verification.results.length} verifications passed for ${models.length}${wanted ? " selected" : ""} models.`,
          );
          NODE
      - name: Retain verification commands and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quint-state-results-${{ github.run_id }}
          path: evidence/formal
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Require the inventory and every model shard
        env:
          INVENTORY_RESULT: ${{ needs.inventory.result }}
          MODELS_RESULT: ${{ needs.models.result }}
        run: |
          test "$INVENTORY_RESULT" = success
          test "$MODELS_RESULT" = success
