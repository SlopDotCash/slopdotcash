# Slopbot v2. This Worker deploys only through the checked-in release workflow
# (.github/workflows/deploy.yml) when the SLOPBOT_RELEASE repository variable
# is "enabled". The owner manages its custom domain outside this file.
name = "slop-slopbot"
main = "entrypoint.ts"
compatibility_date = "2026-07-30"
workers_dev = false

[[d1_databases]]
binding = "SLOPBOT_DB"
database_name = "slop-private"
database_id = "1b453124-2709-45af-8389-151a8105c461"
migrations_dir = "../../migrations"

[[services]]
binding = "SLOP_NOTIFY"
service = "slop-notify"

[[services]]
binding = "VALUE_MERGE_VERIFIER"
service = "slop-vetting-sandbox"
entrypoint = "MergeVerifier"

[[queues.producers]]
binding = "SLOPBOT_QUEUE"
queue = "slopbot-jobs"

[[queues.consumers]]
queue = "slopbot-jobs"
max_batch_size = 5
max_retries = 5
dead_letter_queue = "slopbot-jobs-dlq"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# Off until the owner approves Slopbot v2 closures (PRD BOT-06, BOT-12).
SLOPBOT_CLOSURE_ENABLED = "false"
# Slop moderators who decide escalated appeals (owner decision, PRD section 11):
# lalalune and drew-dot-com, by immutable GitHub ID.
PROJECT_MODERATOR_GITHUB_IDS = "18633264,202660855"

[observability]
enabled = true

  [observability.logs]
  invocation_logs = false
