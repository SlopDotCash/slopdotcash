# Slopbot v2 (draft). Not deployed: production deploys go only through the
# checked-in GitHub Actions workflow after owner approval and the deploy lever
# is claimed. No route is declared until then.
name = "slop-slopbot"
main = "index.ts"
compatibility_date = "2026-07-30"
workers_dev = false

[[d1_databases]]
binding = "SLOPBOT_DB"
database_name = "slop-private"
database_id = "1b453124-2709-45af-8389-151a8105c461"
migrations_dir = "../../migrations"

[[queues.producers]]
binding = "SLOPBOT_QUEUE"
queue = "slopbot-jobs"

[[queues.consumers]]
queue = "slopbot-jobs"
max_batch_size = 5
max_retries = 5
dead_letter_queue = "slopbot-jobs-dlq"

[vars]
# Off until the owner approves Slopbot v2 closures (PRD BOT-06, BOT-12).
SLOPBOT_CLOSURE_ENABLED = "false"

[observability]
enabled = true

  [observability.logs]
  invocation_logs = false
