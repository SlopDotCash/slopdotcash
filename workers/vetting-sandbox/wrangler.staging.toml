name = "slop-vetting-sandbox-staging"
main = "index.ts"
compatibility_date = "2026-07-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[build]
command = "bun --no-env-file scripts/prepare-vetting-sandbox.mjs"

[[containers]]
class_name = "OfflineSandbox"
image = "./Dockerfile"
max_instances = 2
instance_type = "basic"

[[durable_objects.bindings]]
name = "RUNNER"
class_name = "OfflineSandbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OfflineSandbox"]

[observability]
enabled = false
