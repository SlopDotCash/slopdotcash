# Fee-wallet converter (PRD MVP-07c). Off by default. Releases go only through
# the checked-in deploy workflow when the SLOP_FEE_CONVERTER_RELEASE repository
# variable is "enabled". See README.md before changing any value here.
name = "slop-fee-converter"
main = "index.ts"
compatibility_date = "2026-07-30"
workers_dev = false
preview_urls = false

# No routes: the Worker runs only on its cron trigger. Every minute it converts
# fees whose fee-wallet balance changed (receipts); each 15th minute it runs a
# full recovery scan instead (index.ts RECOVERY_SCAN_MINUTES).
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "FEE_DB"
database_name = "slop-private"
database_id = "1b453124-2709-45af-8389-151a8105c461"
migrations_dir = "../../migrations"

[vars]
# off | dry_run | live. dry_run quotes and records but never loads a key.
FEE_CONVERTER_MODE = "live"
# Comma-separated subset of base,ethereum,robinhood,solana.
# Conditional owner activation requires verified funding and limits. Native
# operating limits below are owner-approved. Solana's separate rotation
# authority is verified; approved lamport limits use the durable native journal.
# The controls release and approved 0.05 SOL gas top-up are complete (#905).
# Owner decision, 27 October 2026: approval is conditional; live Solana remains
# deferred while owner vault setup is on another computer. Verify an independent
# full-history recovery RPC and the first registered Solana vault, then use a
# later reviewed main release to activate. Do not repeat funding or upgrades.
FEE_CONVERTER_NETWORKS = "base,ethereum,robinhood"
# Optional operator allowlist, e.g. {"base":["0x..."]}. Project reward assets
# from D1 are always candidates; arbitrary airdropped tokens never are.
FEE_CONVERTER_ALLOWLIST = ""
# USDC micro-units (1 USDC = 1000000). Every limit below is required once the
# mode is not off; the code has no fallback.
# Dust threshold: owner decision of 24 October 2026 (PRD section 11). Balances
# under 5 USDC, or worth less than 10 times the gas cost, accumulate until they
# are worth converting.
FEE_CONVERTER_MIN_VALUE_MICRO = "5000000"
FEE_CONVERTER_GAS_MULTIPLE = "10"
FEE_CONVERTER_MAX_SLIPPAGE_BPS = "100"
FEE_CONVERTER_MAX_PRICE_IMPACT_BPS = "200"
FEE_CONVERTER_RUN_CAP_MICRO = "1000000000"
FEE_CONVERTER_DAILY_CAP_MICRO = "5000000000"
FEE_CONVERTER_SOLANA_FEE_MICRO = "2000"
# Native gas budgets: decimal wei on EVM; lamports on Solana (26 October 2026).
# Solana: 0.005 SOL per transaction / 0.02 SOL per UTC day, including rent
# and priority fees. These supersede the first 0.001 / 0.01 SOL proposal.
# Base
# 0.0001 ETH per transaction and 0.001 ETH per UTC day with a 0.00005 ETH
# data/operator allowance inside the transaction ceiling; Ethereum 0.001 and
# 0.01 ETH; Robinhood 0.0002 and 0.002 ETH. These supersede the earlier values.
# Base requires a positive allowance; other networks use "0".
FEE_CONVERTER_NATIVE_BUDGETS = '{"base":{"perTransaction":"100000000000000","perDay":"1000000000000000","additionalFeeReserve":"50000000000000"},"ethereum":{"perTransaction":"1000000000000000","perDay":"10000000000000000","additionalFeeReserve":"0"},"robinhood":{"perTransaction":"200000000000000","perDay":"2000000000000000","additionalFeeReserve":"0"},"solana":{"perTransaction":"5000000","perDay":"20000000","additionalFeeReserve":"0"}}'
# Robinhood fees are not_converted: retain each received asset unchanged.
# No conversion target, quote, signing key load, swap or bridge is needed.
# Published network fee wallets (docs/slop-product-requirements.md TOK-06). Robinhood
# Chain and Ethereum fee-wallet decisions are recorded in the PRD. Network
# configuration and conversion activation still require their reviewed gates.
FEE_WALLET_BASE = "0x8f77c37d8650776bfe73c9b12b15209ee15d9b86"
# Owner decision 19 October 2026: the Base fee wallet is also the Robinhood
# Chain and Ethereum fee wallet.
FEE_WALLET_ROBINHOOD = "0x8f77c37d8650776bfe73c9b12b15209ee15d9b86"
FEE_WALLET_ETHEREUM = "0x8f77c37d8650776bfe73c9b12b15209ee15d9b86"
FEE_WALLET_SOLANA = "9EyxVhhnCJH4QL5bDsRyukrkHFyitFMuf45UDdLxm4BY"
KYBERSWAP_CLIENT_ID = "slop-fee-converter"

# SLOP buyback (PRD section 6, "SLOP buyback and burn"; owner decision of
# 10 November 2026). Off: nothing below is read and every network behaves as
# before. Activation is a later reviewed change of BUYBACK_MODE and
# BUYBACK_START_AT (see README.md, "SLOP buyback"); merging these values
# activates nothing. Each limit below is a proposal that the owner confirms
# at activation; the code has no fallback for any of them.
BUYBACK_MODE = "off"
# UTC instant from which fee income counts; earlier fees never enter the buyback.
BUYBACK_START_AT = ""
# Half of all fee income funds the buyback; half of acquired SLOP is burned.
BUYBACK_SHARE_BPS = "5000"
BUYBACK_BURN_BPS = "5000"
# Bridge at least 500 USDC per order; spread, fixed protocol fee and network
# fee together may cost at most 1.5% of it.
BUYBACK_MIN_BRIDGE_MICRO = "500000000"
BUYBACK_MAX_BRIDGE_COST_BPS = "150"
# Highest native cost of one order: the deBridge fixed fee on Base and
# Ethereum (0.001 ETH), and on Solana the whole SOL debit of the order
# (order-account rent, fixed fee and network fee; 0.05 SOL).
BUYBACK_MAX_BRIDGE_NATIVE_FEE = '{"base":"1000000000000000","ethereum":"1000000000000000","solana":"50000000"}'
# Solana bridge orders have their own native budget, in lamports, separate
# from FEE_CONVERTER_NATIVE_BUDGETS: 0.05 SOL per order, 0.1 SOL per UTC day.
BUYBACK_SOLANA_BRIDGE_NATIVE = '{"perTransaction":"50000000","perDay":"100000000"}'
# Buy at least 25 USDG of value; burn at least 5 USDG of value.
BUYBACK_MIN_BUY_MICRO = "25000000"
BUYBACK_MIN_BURN_MICRO = "5000000"
# The SLOP pools charge about 1%, which counts as price impact.
BUYBACK_MAX_SLIPPAGE_BPS = "100"
BUYBACK_MAX_PRICE_IMPACT_BPS = "300"
# Per network and leg: 1,000 per run and 5,000 per rolling 24 hours.
BUYBACK_RUN_CAP_MICRO = "1000000000"
BUYBACK_DAILY_CAP_MICRO = "5000000000"
# Report a deposited order that no taker filled within one hour.
BUYBACK_UNFILLED_ALERT_SECONDS = "3600"

# Secrets, set only with `wrangler secret put` by the key custodian:
#   FEE_WALLET_KEY_BASE, FEE_WALLET_KEY_ETHEREUM, FEE_WALLET_KEY_ROBINHOOD,
#   FEE_WALLET_KEY_SOLANA, optional RPC_URL_<NETWORK> and JUPITER_API_KEY.

[observability]
enabled = true

  [observability.logs]
  invocation_logs = false
