# Submission-fee Worker (workers/submission-fee; PRD section 6, "Submission
# fee deposits", operator decision of 18 November 2026). The checked main
# release installs this private Worker. It ships off: it reads no chain,
# writes nothing and loads no key. Its contracts are not deployed yet.
# See README.md before changing any value here.
name = "slop-submission-fee"
main = "index.ts"
compatibility_date = "2026-07-30"
workers_dev = false
preview_urls = false

# No routes. Every five minutes: read deposits and send what is due.
# Once an hour: read the SLOP price and keep the SLOP rate.
[triggers]
crons = ["*/5 * * * *", "7 * * * *"]

[[d1_databases]]
binding = "SUBMISSION_FEE_DB"
database_name = "slop-private"
database_id = "1b453124-2709-45af-8389-151a8105c461"
migrations_dir = "../../migrations"

[vars]
# off | dry_run | live. dry_run reads deposits, judges them, marks pull
# requests paid and records the list it would send; it loads no key and signs
# nothing. live also signs and sends the resolver's transactions, and is
# refused by the release unless both contracts and the key are in place.
# Record-only from 19 November 2026, once the Worker held keyed endpoints for
# both networks (from Cloudflare the public endpoints refuse its log reads).
# Live since 21 November 2026 (operator decision), changed together with
# Slopbot's mode and SUBMISSION_FEE_SWITCHED_ON.
SUBMISSION_FEE_MODE = "live"
# Resolver gas ceilings: 0.0002 ETH for one transaction, 0.002 ETH in one UTC
# day on each network. A transaction that would pass either is not signed.
SUBMISSION_FEE_MAX_NATIVE_PER_TX_WEI = "200000000000000"
SUBMISSION_FEE_MAX_NATIVE_PER_DAY_WEI = "2000000000000000"

# The Solana ledger's own switch (operator decision, 25 November 2026):
# off | dry_run | live, independent of SUBMISSION_FEE_MODE above, which
# governs Base and Robinhood Chain only. It ships off. While the program id
# in src/lib/submission-fee.mjs is null nothing is read on Solana in any
# mode. Change it to live only together with
# SUBMISSION_FEE_SOLANA_SWITCHED_ON in that file.
SUBMISSION_FEE_SOLANA_MODE = "off"
# Solana resolver fee ceilings in lamports: 0.00002 SOL for one transaction
# (four times the base fee of one signature) and 0.002 SOL in one UTC day.
SUBMISSION_FEE_SOLANA_MAX_LAMPORTS_PER_TX = "20000"
SUBMISSION_FEE_SOLANA_MAX_LAMPORTS_PER_DAY = "2000000"

# Secrets for Solana, needed only once its mode is not off:
# RPC_URL_SUBMISSION_FEE_SOLANA (a keyed https endpoint; Solana has no public
# default) and, for live, SUBMISSION_FEE_SOLANA_RESOLVER_SEED (the resolver's
# 32-byte ed25519 seed as 64 hex digits).
#
# Secret for live mode: SUBMISSION_FEE_RESOLVER_KEY. Install privately on the
# Worker; never pass its value to CI. Optional secrets:
# RPC_URL_SUBMISSION_FEE_BASE and RPC_URL_SUBMISSION_FEE_ROBINHOOD.

[observability]
enabled = true

  [observability.logs]
  invocation_logs = false
